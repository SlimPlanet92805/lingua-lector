<script>
"use strict";

// ============================================================
// Pagination + rendering
// ============================================================
let paragraphSentences = []; // [{id, text}, ...] per paragraph, stable across pages
let currentPage = 0;
let totalPages = 1;
const cache = new Map(); // cacheKey -> {grammarHtml, vocabHtml} or {error}
let activeSpan = null;

function sentenceHash(sentenceText) {
  let hash = 0;
  for (let i = 0; i < sentenceText.length; i++) {
    hash = ((hash << 5) - hash + sentenceText.charCodeAt(i)) | 0;
  }
  return hash;
}

// Cache keys are content-based (chapter id + sentence text), not the plain
// numeric sid, because sid is just a per-render counter that gets reassigned
// every time chapters/text changes — using it directly would silently
// invalidate (or worse, cross-wire) the persisted cache after any switch.
// Takes an explicit chapterId (rather than reading currentChapter()) so it
// also works for chapters other than the one currently on screen -- e.g. the
// vocabulary exporter, which walks a whole document's chapters.
function cacheKeyForChapter(sentenceText, chapterId) {
  return (chapterId || 'custom') + ':' + sentenceHash(sentenceText);
}

function cacheKeyFor(sentenceText) {
  return cacheKeyForChapter(sentenceText, currentChapter().id);
}

// Cache is namespaced per document as well as per chapter, so switching
// documents never touches another document's cached analyses. Explicit-param
// sibling of cacheStorageKey(), for the same reason as cacheKeyForChapter().
function cacheStorageKeyFor(docId, chapterId) {
  return CACHE_STORAGE_PREFIX + docId + ':' + (chapterId || 'custom');
}

function cacheStorageKey() {
  return cacheStorageKeyFor(currentDocId, currentChapter().id);
}

// Blob storage is async (see initBlobStore), so warming can't be done inline
// during rebuildParagraphSentences() any more. The cache only affects what
// happens when a sentence is *clicked*, so rendering does not have to wait for
// it -- but a click landing in that window would re-analyse a sentence that
// was already paid for, so onSentenceClick() awaits this promise before
// looking in the cache.
let cacheWarmPromise = Promise.resolve();

function warmCacheFromStorage() {
  cache.clear();
  const key = cacheStorageKey(); // captured now: the chapter may change meanwhile
  cacheWarmPromise = blobGet(key).then(raw => {
    // A switch that happened while this was in flight already cleared the map
    // and started its own warm; don't pour a stale chapter's entries into it.
    if (key !== cacheStorageKey()) return;
    if (!raw) return;
    try {
      const parsed = JSON.parse(raw);
      Object.keys(parsed).forEach(k => cache.set(k, parsed[k]));
    } catch (e) { /* ignore corrupt cache */ }
  }).catch(() => {});
  return cacheWarmPromise;
}

// The storage key and a snapshot of the cache are captured immediately (not
// inside the timeout callback) so that switching documents/chapters within
// the debounce window can't cause the write to land under the WRONG key --
// or get silently cancelled by clearTimeout() when the next switch calls
// this again for a different document.
let persistCacheTimer = null;
let pendingCacheWrite = null; // { key, obj }

function flushPendingCacheWrite() {
  if (!pendingCacheWrite) return;
  clearTimeout(persistCacheTimer);
  persistCacheTimer = null;
  const { key, obj } = pendingCacheWrite;
  pendingCacheWrite = null;
  return blobSet(key, JSON.stringify(obj)).catch(err => {
    // Losing a cached analysis is not fatal -- it will be re-fetched -- but it
    // costs the reader an API call, so say so rather than failing silently.
    reportStorageError(err);
  });
}

function persistCacheDebounced() {
  const obj = {};
  cache.forEach((v, k) => { obj[k] = v; });
  pendingCacheWrite = { key: cacheStorageKey(), obj };
  clearTimeout(persistCacheTimer);
  persistCacheTimer = setTimeout(flushPendingCacheWrite, 400);
}

// Drops every persisted analysis of one document (all of its chapters). When
// that document is the one on screen its in-memory copy has to go too -- and
// any debounced write still in flight, which would otherwise re-persist the
// entries we just deleted a few hundred milliseconds later.
async function clearDocumentCache(docId) {
  if (docId === currentDocId) {
    cache.clear();
    clearTimeout(persistCacheTimer);
    persistCacheTimer = null;
    pendingCacheWrite = null;
  }
  try {
    const prefix = CACHE_STORAGE_PREFIX + docId + ':';
    const keys = await blobKeys(prefix);
    for (const k of keys) await blobRemove(k);
  } catch (e) { /* ignore */ }
}

function clearCurrentDocumentCache() {
  return clearDocumentCache(currentDocId);
}

// ============================================================
// Vocabulary export (CSV, one row per vocab bullet across a document)
// ============================================================

// The built-in book is never written to blob storage under BOOK_DOC_ID unless
// its chapter titles were edited (see switchToDocument()/loadInitialDocument()
// in part3) -- a reader who just opened the app and clicked some sentences has
// no lingua-lector-doc-book:heyking blob at all. loadDocumentContent() would
// return null for that common case, so the built-in book is served from the
// BOOK_CHAPTERS build constant directly, exactly like switchToDocument() does.
async function documentContentForExport(docId) {
  if (docId === BOOK_DOC_ID) return { bookTitle: BOOK_TITLE, chapters: BOOK_CHAPTERS };
  return loadDocumentContent(docId);
}

// A single, un-doubled em dash -- the vocab template is `*word* — definition`
// (buildSystemPrompt()). The structure section's clause bullets use a doubled
// em dash ("——"), so this does not need extra guarding against matching those;
// callers only ever run it against the isolated vocabMd half of a response
// anyway (see collectVocabRows()).
const VOCAB_BULLET_RE = /^-\s+\*(.+?)\*\s+—\s+(.*)$/;

// Same emphasis markers inlineMd() turns into HTML, but stripped rather than
// wrapped -- a CSV cell wants plain text, not markup.
function stripMdEmphasis(text) {
  return text.replace(/\*\*(.+?)\*\*/g, '$1').replace(/`(.+?)`/g, '$1').replace(/\*(.+?)\*/g, '$1');
}

function parseVocabBullets(vocabMd) {
  const lines = (vocabMd || '').split('\n');
  const entries = [];
  for (const raw of lines) {
    const m = raw.match(VOCAB_BULLET_RE);
    if (m) {
      entries.push({ word: stripMdEmphasis(m[1]).trim(), notes: stripMdEmphasis(m[2]).trim() });
      continue;
    }
    // An indented continuation line belongs to the previous bullet (mirrors
    // mdToHtml()'s lazy-continuation handling) rather than being dropped --
    // in practice the prompt does not ask for wrapped vocab lines, but a model
    // that wraps one anyway should not silently lose it.
    if (entries.length && /^\s/.test(raw) && raw.trim()) {
      entries[entries.length - 1].notes += ' ' + stripMdEmphasis(raw.trim());
    }
  }
  return entries;
}

function toCsvField(value) {
  const s = String(value == null ? '' : value);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function toCsvRow(fields) {
  return fields.map(toCsvField).join(',') + '\r\n';
}

const VOCAB_CSV_HEADER = ['Word', 'Notes', 'Example sentence', 'Chapter'];

function buildVocabCsv(rows) {
  return toCsvRow(VOCAB_CSV_HEADER) + rows.map(toCsvRow).join('');
}

// Walks every chapter of a document, re-splitting its paragraphs the same way
// rebuildParagraphSentences() does so each unit's hash can be matched against
// whatever that chapter's persisted cache blob actually holds -- the cache key
// is a one-way hash of the sentence text (cacheKeyForChapter()), so there is
// no stored reverse mapping from a cached entry back to its sentence text.
// Only chapters with a cache blob at all are re-split, which keeps this cheap
// even for a long, mostly-unread book.
async function collectVocabRows(docId) {
  const content = await documentContentForExport(docId);
  if (!content || !Array.isArray(content.chapters)) return [];
  const rows = [];
  for (const chapter of content.chapters) {
    let chapterCache = null;
    try {
      const raw = await blobGet(cacheStorageKeyFor(docId, chapter.id));
      chapterCache = raw ? JSON.parse(raw) : null;
    } catch (e) { continue; }
    if (!chapterCache) continue;
    for (const paraText of chapter.paragraphs) {
      const { units } = splitIntoSentenceUnits(paraText, settings.sentenceLang);
      for (const unit of units) {
        const entry = chapterCache[cacheKeyForChapter(unit.text, chapter.id)];
        if (!entry || entry.error || !entry.history || !entry.history[1]) continue;
        const { vocabMd } = splitAnalysisSections(normalizeTranslationLabel(entry.history[1].content));
        for (const { word, notes } of parseVocabBullets(vocabMd)) {
          rows.push([word, notes, unit.text, chapter.title || '']);
        }
      }
    }
  }
  return rows;
}

function sanitizeFilenamePart(s) {
  return (s || 'document').replace(/[\\/:*?"<>|]+/g, '_').trim() || 'document';
}

function triggerCsvDownload(filename, csvText) {
  const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function exportDocumentVocabToCsv(docId, docTitle) {
  const title = docTitle || t('settings.libraryUntitled');
  const rows = await collectVocabRows(docId);
  if (!rows.length) {
    setImportStatus(t('export.noVocabulary', { title }), 'error');
    return;
  }
  triggerCsvDownload(sanitizeFilenamePart(docTitle) + '-vocab.csv', buildVocabCsv(rows));
  setImportStatus(t('export.success', { n: rows.length, title }), 'success');
}

// Segments, not sentences: one sentence can occupy several non-adjacent
// stretches of a paragraph when a footnote interrupts it (see
// splitIntoSentenceUnits). Every segment carries the id of the sentence it
// belongs to, so several segments can share one id.
let flatSentences = []; // [{ pIdx, id, text }, ...] across the chapter, in reading order
let sentenceTexts = new Map(); // sentence id -> the text actually sent for analysis

function rebuildParagraphSentences() {
  flushPendingCacheWrite(); // never let a chapter/document switch drop a pending write
  let sentCounter = 0;
  sentenceTexts = new Map();
  paragraphSentences = PARAGRAPHS.map((paraText) => {
    const { units, segments } = splitIntoSentenceUnits(paraText, settings.sentenceLang);
    // unit ids are per-paragraph; map them onto ids unique across the chapter
    const globalId = new Map();
    units.forEach((u) => {
      const id = sentCounter++;
      globalId.set(u.uid, id);
      sentenceTexts.set(id, u.text);
    });
    return segments.map((s) => ({ id: globalId.get(s.uid), text: s.text }));
  });
  flatSentences = [];
  paragraphSentences.forEach((segs, pIdx) => {
    segs.forEach(({ id, text }) => flatSentences.push({ pIdx, id, text }));
  });
  warmCacheFromStorage();
  recomputeTotalPages();
}

function spansForSentence(id) {
  return document.querySelectorAll(`.sent[data-sid="${id}"]`);
}

function buildParagraphElement(pIdx) {
  const p = document.createElement('p');
  p.className = 'para';
  const seen = new Set();
  (paragraphSentences[pIdx] || []).forEach(({ id, text }) => {
    appendSentenceSpan(p, pIdx, id, text, !seen.has(id));
    seen.add(id);
  });
  return p;
}

// `isFirst` marks a sentence's first segment. Only that one is a focus stop:
// making every segment tabbable would force a keyboard user to tab through the
// same sentence twice just because a footnote splits it.
function appendSentenceSpan(pEl, pIdx, id, text, isFirst) {
  // Segments carry their own surrounding whitespace so that they tile the
  // paragraph exactly. A whitespace-only segment becomes a plain text node --
  // it would otherwise be an invisible clickable sliver between two sentences.
  if (!text.trim()) {
    pEl.appendChild(document.createTextNode(text));
    return;
  }
  const span = document.createElement('span');
  span.className = 'sent';
  span.dataset.sid = String(id);
  span.dataset.paraIdx = String(pIdx);
  span.textContent = text;
  // Tell assistive tech which language this is. On a foreign-language reading
  // tool this is the single highest-value accessibility attribute there is:
  // without it a screen reader pronounces German text with the UI language's
  // phonetics.
  span.lang = settings.sentenceLang || 'de';
  if (isFirst) {
    span.setAttribute('role', 'button');
    span.tabIndex = 0;
  }
  // A property, not an attribute, so it cannot survive a rebuild from
  // serialized HTML: that is what makes it a reliable "this node is the one we
  // created" marker for the click probe in installDebugProbes.
  span.__wired = true;
  pEl.appendChild(span);
}

// All sentence interaction is delegated to the container, which outlives every
// page render -- there are no per-span listeners at all.
//
// This is not a tidiness refactor. Per-span listeners made the app depend on
// nobody ever rebuilding those spans, and something does: a browser's page
// translator (Chromium's, as used by Edge on Android) re-creates the paragraphs
// it processes from serialized HTML. The rebuilt spans keep their class,
// data-sid and text, and lose every listener -- so tapping them highlighted the
// sentence (that is CSS :active, which needs no JS) and did nothing else, on
// exactly the part of the page the translator had reached. Going to the next
// page and back "fixed" it because that renders fresh spans.
//
// Delegation is immune to the whole class: whatever rebuilds a span, it is
// still inside the container, so the handler still finds it via closest().
// (translate="no" on the container stops that particular rewriter too, but the
// same trick is available to extensions, reader modes and userscripts.)
function wireSentenceDelegation() {
  const root = document.getElementById('text-container');
  if (!root) return;

  const sentenceAt = (node) => (node && node.closest) ? node.closest('.sent') : null;
  // The text of the *unit*, not of the span: a sentence split by a footnote has
  // several spans, and the span's own text would key to a different cache entry.
  // Keys are numbers (rebuildParagraphSentences assigns them from a counter);
  // data-sid comes back as a string, hence the conversion.
  const textFor = (span) => sentenceTexts.get(Number(span.dataset.sid)) || span.textContent;

  root.addEventListener('click', (e) => {
    const span = sentenceAt(e.target);
    if (span) onSentenceClick(span, textFor(span));
  });

  // "Click somewhere blank to put the sentence down" has to be wired to the
  // whole reading area, not to #text-container. In fit-height mode the
  // container is given an explicit width and height and does cover the page,
  // which is why this appeared to work; in the paragraph modes (the default,
  // and so what most people actually see) it is only as tall as the text it
  // holds, so every genuinely blank spot -- the page margins, the gap under
  // the last paragraph -- is outside it and the click landed on nothing.
  //
  // It also closes the panel now. The panel is showing the analysis of the
  // sentence being put down; leaving it open afterwards left the reader
  // looking at a breakdown of a sentence that was no longer marked anywhere.
  const readerWrap = document.querySelector('.reader-wrap');
  if (readerWrap) {
    readerWrap.addEventListener('click', (e) => {
      if (sentenceAt(e.target)) return;
      // Everything with its own job: the pager, the editable title fields, the
      // toolbar. Clicking those is not "clicking blank space".
      if (e.target.closest && e.target.closest('button, input, select, textarea, a, label')) return;
      if (!panelEl.classList.contains('collapsed')) togglePanel(); // this clears the highlight too
      else clearActiveSentence();
    });
  }

  root.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const span = sentenceAt(e.target);
    if (!span || span.getAttribute('role') !== 'button') return;
    e.preventDefault();
    onSentenceClick(span, textFor(span));
  });

  // mouseenter/mouseleave don't bubble, so delegation uses mouseover/mouseout.
  // The comparison is by sid rather than by element: a sentence split by a
  // footnote is several spans, and crossing from one of them to another is
  // movement *within* one sentence -- comparing elements made the highlight
  // flicker off and back on at every internal boundary.
  const sidAt = (node) => { const s = sentenceAt(node); return s ? s.dataset.sid : null; };
  root.addEventListener('mouseover', (e) => {
    const span = sentenceAt(e.target);
    if (!span || sidAt(e.relatedTarget) === span.dataset.sid) return;
    spansForSentence(span.dataset.sid).forEach((el) => el.classList.add('hover'));
  });
  root.addEventListener('mouseout', (e) => {
    const span = sentenceAt(e.target);
    if (!span || sidAt(e.relatedTarget) === span.dataset.sid) return;
    spansForSentence(span.dataset.sid).forEach((el) => el.classList.remove('hover'));
  });
}

function renderAllParagraphsInto(el) {
  el.innerHTML = '';
  let pEl = null;
  let currentPIdx = -1;
  const seen = new Set();
  flatSentences.forEach((item) => {
    if (item.pIdx !== currentPIdx) {
      pEl = document.createElement('p');
      pEl.className = 'para';
      el.appendChild(pEl);
      currentPIdx = item.pIdx;
    }
    appendSentenceSpan(pEl, item.pIdx, item.id, item.text, !seen.has(item.id));
    seen.add(item.id);
  });
}

// ============================================================
// "Fit one screen per page" pagination, via real CSS multi-column layout
// instead of a hand-rolled height-measuring loop. The whole chapter is laid
// out ONCE as continuous columns exactly one viewport-width wide; "paging"
// is just translateX-ing that column strip by one column per page, the same
// technique epub readers use. This intentionally allows a sentence to be
// visually cut across a page boundary (its <span> is one element; the
// column layout can end mid-element and continue it at the top of the next
// column) -- trying to keep whole sentences on one page inevitably fights
// with real device/window heights and real sentence lengths and produces
// either overflow or wasted blank space; letting the browser's own text
// engine do the breaking, exactly like it breaks lines, sidesteps that
// entirely and can never overflow by construction.
// ============================================================
let columnPageWidth = 0;

function outerHeight(el) {
  if (!el) return 0;
  const cs = getComputedStyle(el);
  return el.offsetHeight + parseFloat(cs.marginTop || 0) + parseFloat(cs.marginBottom || 0);
}

// Sizes #text-container (the fixed-size clipping viewport) and #text-columns
// (the actual column-laid-out content, wider than the viewport and shifted
// via transform) to match the space actually available below the toolbar/
// book-header/divider and above the bottom pager.
function computeColumnLayout() {
  const wrap = document.querySelector('.reader-wrap');
  const readerInner = document.querySelector('.reader-inner');
  const textContainer = document.getElementById('text-container');
  const columns = document.getElementById('text-columns');
  if (!wrap || !readerInner || !textContainer || !columns) return;

  const toolbar = document.querySelector('.toolbar');
  const header = document.querySelector('.book-header');
  const divider = document.querySelector('.divider');
  const used = outerHeight(toolbar) + outerHeight(header) + outerHeight(divider);
  const innerCs = getComputedStyle(readerInner);
  const vPad = parseFloat(innerCs.paddingTop || 0) + parseFloat(innerCs.paddingBottom || 0);
  const availableHeight = Math.max(200, wrap.clientHeight - used - vPad - 20);

  const innerRect = readerInner.getBoundingClientRect();
  const contentWidth = Math.max(
    100,
    innerRect.width - parseFloat(innerCs.paddingLeft || 0) - parseFloat(innerCs.paddingRight || 0)
  );

  columnPageWidth = contentWidth;

  textContainer.style.width = contentWidth + 'px';
  textContainer.style.height = availableHeight + 'px';
  textContainer.style.overflow = 'hidden';

  columns.style.columnWidth = contentWidth + 'px';
  columns.style.columnGap = '0px';
  columns.style.columnFill = 'auto';
  columns.style.height = availableHeight + 'px';
  columns.style.width = 'auto';
  columns.style.transition = 'none'; // set only while the user is actively paging, see goToPage()
}

// Undoes computeColumnLayout()'s inline sizing for the non-fit-height modes,
// letting #text-container/#text-columns fall back to normal block flow
// (reader-wrap itself scrolls when content overflows, as before).
function resetColumnLayout() {
  const textContainer = document.getElementById('text-container');
  const columns = document.getElementById('text-columns');
  if (textContainer) {
    textContainer.style.width = '';
    textContainer.style.height = '';
    textContainer.style.overflow = '';
  }
  if (columns) {
    columns.style.columnWidth = '';
    columns.style.columnGap = '';
    columns.style.columnFill = '';
    columns.style.height = '';
    columns.style.width = '';
    columns.style.transform = '';
    columns.style.transition = '';
  }
}

function recomputeTotalPages() {
  const columns = document.getElementById('text-columns');
  if (settings.paginationMode === 'none') {
    resetColumnLayout();
    totalPages = 1;
  } else if (settings.paginationMode === 'fit-height') {
    renderAllParagraphsInto(columns);
    computeColumnLayout();
    totalPages = columnPageWidth ? Math.max(1, Math.round(columns.scrollWidth / columnPageWidth)) : 1;
  } else {
    resetColumnLayout();
    const perPage = Math.max(1, settings.parasPerPage || 8);
    totalPages = Math.max(1, Math.ceil(PARAGRAPHS.length / perPage));
  }
}

function renderPage(pageIndex) {
  currentPage = Math.max(0, Math.min(totalPages - 1, pageIndex));
  const columns = document.getElementById('text-columns');

  if (!PARAGRAPHS.length) {
    resetColumnLayout();
    columns.innerHTML = `
      <div class="empty-state">
        ${t('emptyState.text')}
        <br><button id="empty-open-settings">${t('emptyState.openSettings')}</button>
      </div>`;
    document.getElementById('empty-open-settings').addEventListener('click', openSettings);
    updatePagerUI();
    return;
  }

  if (settings.paginationMode === 'fit-height') {
    // content is already fully laid out by recomputeTotalPages(); paging is
    // just shifting the column strip
    columns.style.transform = `translateX(${-currentPage * columnPageWidth}px)`;
  } else {
    resetColumnLayout();
    columns.innerHTML = '';
    let start = 0, end = PARAGRAPHS.length;
    if (settings.paginationMode !== 'none') {
      const perPage = Math.max(1, settings.parasPerPage || 8);
      start = currentPage * perPage;
      end = Math.min(PARAGRAPHS.length, start + perPage);
    }
    for (let pIdx = start; pIdx < end; pIdx++) {
      columns.appendChild(buildParagraphElement(pIdx));
    }
  }

  updatePagerUI();
  saveProgress();
  const wrap = document.querySelector('.reader-wrap');
  if (wrap && typeof wrap.scrollTo === 'function') {
    wrap.scrollTo({ top: 0, behavior: 'auto' });
  } else if (wrap) {
    wrap.scrollTop = 0;
  }
}

let resizeRerenderTimer = null;
function wireResizeRerender() {
  window.addEventListener('resize', () => {
    // Title refitting is deliberately NOT done here. A resize fires a burst of
    // events, and measuring inside one reads a width the layout hasn't caught
    // up with yet -- which shrank titles to the floor and left them there.
    // observeTitleFit()'s ResizeObserver reports a settled width instead.
    if (settings.paginationMode !== 'fit-height') return;
    clearTimeout(resizeRerenderTimer);
    resizeRerenderTimer = setTimeout(() => {
      recomputeTotalPages();
      renderPage(Math.min(currentPage, totalPages - 1));
    }, 250);
  });
}

function updatePagerUI() {
  const showPager = settings.paginationMode !== 'none' && PARAGRAPHS.length > 0;
  document.querySelectorAll('.pager-page-input').forEach(el => {
    el.max = String(totalPages);
    if (document.activeElement !== el) el.value = String(currentPage + 1);
  });
  document.querySelectorAll('.pager-total').forEach(el => {
    el.textContent = String(totalPages);
  });
  document.querySelectorAll('.pager-prev, .pager-next').forEach(el => {
    el.style.display = showPager ? '' : 'none';
  });
  document.querySelectorAll('.pager-status').forEach(el => {
    el.style.display = showPager ? '' : 'none';
  });
  const bottomPager = document.getElementById('bottom-pager-wrap');
  if (bottomPager) bottomPager.style.display = showPager ? 'flex' : 'none';
  document.querySelectorAll('.pager-prev').forEach(el => { el.disabled = currentPage <= 0; });
  document.querySelectorAll('.pager-next').forEach(el => { el.disabled = currentPage >= totalPages - 1; });
}

// How long each half of a page turn takes in the paragraph modes. Short: this
// fires on every single page turn, and an animation you see a hundred times an
// evening has to be over before it can start being in the way.
const PAGE_SLIDE_MS = 150;
let pageSlideTimers = [];
// The page a turn already in flight is heading for. currentPage does not
// change until the outgoing half finishes, so without this a second tap on
// "next" during those 150ms computed its target from the page being left and
// asked for the one already on its way -- holding the button down advanced one
// page instead of several.
let pendingPage = null;
function plannedPage() {
  return pendingPage === null ? currentPage : pendingPage;
}
function turnPage(step) {
  goToPage(plannedPage() + step);
}

function prefersReducedMotion() {
  return typeof window.matchMedia === 'function'
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

// In fit-height mode the whole book is laid out as one wide column strip and a
// page turn is just a translate of that strip, so it slides for free. The
// paragraph modes rebuild the container's contents instead, which is why they
// used to cut hard from one page to the next -- and since the paragraph mode is
// the default, that is what a phone shows unless its owner went and changed the
// setting. This gives them the same movement: the old page leaves in the
// direction of travel, the new one comes in from the other side.
function slidePageTo(idx) {
  const columns = document.getElementById('text-columns');
  const container = document.getElementById('text-container');
  if (!columns || !container || prefersReducedMotion()) {
    renderPage(idx);
    return;
  }
  // A second turn arriving mid-animation must not leave the first one's
  // cleanup to fire later and wipe the styles out from under it.
  pageSlideTimers.forEach(clearTimeout);
  pageSlideTimers = [];

  const dir = idx > plannedPage() ? 1 : -1;
  pendingPage = idx;
  const distance = container.getBoundingClientRect().width || columns.getBoundingClientRect().width;
  container.style.overflow = 'hidden';

  const ease = (ms, curve) => `transform ${ms}ms ${curve}, opacity ${ms}ms ${curve}`;
  columns.style.transition = ease(PAGE_SLIDE_MS, 'ease-in');
  columns.style.transform = `translateX(${-dir * distance}px)`;
  columns.style.opacity = '0';

  pageSlideTimers.push(setTimeout(() => {
    // renderPage -> resetColumnLayout clears the transform, the transition AND
    // the container's overflow, so everything the incoming half needs has to be
    // set after it, not before.
    renderPage(idx);
    pendingPage = null;
    container.style.overflow = 'hidden';
    columns.style.transition = 'none';
    columns.style.transform = `translateX(${dir * distance}px)`;
    columns.style.opacity = '0';
    // A forced reflow, not requestAnimationFrame: rAF does not run while the
    // tab is in the background, and a page turn left half-finished there would
    // come back to a blank, translated-off-screen page. A synchronous reflow
    // commits the start position with no dependency on frames being produced,
    // and the timers below fire either way.
    void columns.offsetHeight;
    columns.style.transition = ease(PAGE_SLIDE_MS, 'ease-out');
    columns.style.transform = 'translateX(0)';
    columns.style.opacity = '1';
    pageSlideTimers.push(setTimeout(() => {
      columns.style.transition = '';
      columns.style.transform = '';
      columns.style.opacity = '';
      // Back to the stylesheet's value, not to whatever was there when this
      // turn started: a turn interrupting another one would otherwise capture
      // the previous turn's temporary `hidden` and restore that forever.
      container.style.overflow = '';
    }, PAGE_SLIDE_MS + 30));
  }, PAGE_SLIDE_MS));
}

function goToPage(idx) {
  idx = Math.max(0, Math.min(totalPages - 1, idx));
  if (idx === plannedPage()) return;
  if (settings.paginationMode === 'fit-height') {
    const columns = document.getElementById('text-columns');
    if (columns) columns.style.transition = 'transform .2s ease';
    renderPage(idx);
    return;
  }
  slidePageTo(idx);
}

async function saveProgress() {
  const key = progressKeyForCurrentText();
  const payload = JSON.stringify({ page: currentPage, updatedAt: Date.now() });
  try {
    if (window.storage && window.storage.set) {
      await window.storage.set(key, payload);
    }
  } catch (e) { /* artifact storage may be unavailable outside claude.ai */ }
  safeStorageWrite(() => localStorage.setItem(key, payload));
}

async function loadProgress() {
  const key = progressKeyForCurrentText();
  try {
    if (window.storage && window.storage.get) {
      const result = await window.storage.get(key);
      if (result && result.value) {
        const parsed = JSON.parse(result.value);
        if (typeof parsed.page === 'number') return parsed.page;
      }
    }
  } catch (e) { /* fall through to localStorage */ }
  try {
    const raw = localStorage.getItem(key);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (typeof parsed.page === 'number') return parsed.page;
    }
  } catch (e) { /* ignore */ }
  return 0;
}

function wirePagerControls() {
  document.querySelectorAll('.pager-prev').forEach(btn => {
    btn.addEventListener('click', () => turnPage(-1));
  });
  document.querySelectorAll('.pager-next').forEach(btn => {
    btn.addEventListener('click', () => turnPage(1));
  });
  document.querySelectorAll('.pager-page-input').forEach(input => {
    const commit = () => {
      const n = parseInt(input.value, 10);
      if (Number.isFinite(n)) {
        goToPage(Math.max(0, Math.min(totalPages - 1, n - 1)));
      } else {
        input.value = String(currentPage + 1);
      }
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { commit(); input.blur(); }
      else if (e.key === 'Escape') { input.value = String(currentPage + 1); input.blur(); }
      e.stopPropagation(); // don't let the global ←/→ page shortcuts fire while typing
    });
    input.addEventListener('blur', commit);
    input.addEventListener('click', (e) => e.stopPropagation());
  });
}

// ============================================================
// Chapters: switching, table of contents, chapter <select>
// ============================================================
function switchChapter(index) {
  if (index === currentChapterIndex || !chapters[index]) return;
  currentChapterIndex = index;
  syncFromCurrentChapter();
  syncTitleFieldsFromState();
  saveTextToLocalStorage();
  saveCurrentChapterIndex();
  rebuildParagraphSentences();
  renderPage(0);
  renderTocList();
  populateChapterSelect();
  hideToc();
}

// The three header fields are <input>s, so their text cannot wrap: a long
// "Author · Title" is simply cut off at the right edge, which on a phone is
// most of it. Shrinking the type per breakpoint doesn't fix this -- a title
// long enough will overflow any fixed size -- so instead the size is reduced
// until it actually fits, with a floor so it never becomes unreadable.
// scrollWidth is not usable here: on an <input> the engines clamp it to
// clientWidth when the field isn't focused, so an overflowing title reports as
// fitting and the size is never reduced. Measuring the string in a mirror
// span, with the same typography, is what actually answers "how wide is this
// text at this size".
let titleProbe = null;
function titleTextWidth(el, sizePx) {
  if (!titleProbe) {
    titleProbe = document.createElement('span');
    titleProbe.setAttribute('aria-hidden', 'true');
    titleProbe.style.cssText =
      'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:pre;';
    document.body.appendChild(titleProbe);
  }
  const cs = getComputedStyle(el);
  const baseSize = parseFloat(cs.fontSize) || sizePx;
  // letter-spacing is reported in px against the *current* size, so it has to
  // be rescaled or a tracked-out title (the book line is 0.12em) mismeasures.
  const spacing = parseFloat(cs.letterSpacing);
  titleProbe.style.fontFamily = cs.fontFamily;
  titleProbe.style.fontWeight = cs.fontWeight;
  titleProbe.style.fontStyle = cs.fontStyle;
  titleProbe.style.textTransform = cs.textTransform;
  titleProbe.style.fontSize = sizePx + 'px';
  titleProbe.style.letterSpacing =
    Number.isFinite(spacing) ? (spacing * sizePx / baseSize) + 'px' : 'normal';
  titleProbe.textContent = el.value || '';
  return titleProbe.getBoundingClientRect().width;
}

function fitTitleField(el) {
  if (!el || el.classList.contains('hidden')) return;
  // Clearing first makes the starting point whatever the current CSS says, so
  // this stays correct across the media-query breakpoints rather than baking
  // in whichever size happened to apply the first time it ran.
  el.style.fontSize = '';
  const avail = el.clientWidth;
  if (!avail) return; // not laid out yet (display:none ancestor)
  const max = parseFloat(getComputedStyle(el).fontSize);
  if (!max) return;
  const min = Math.max(10, max * 0.55);
  let size = max;
  while (size > min && titleTextWidth(el, size) > avail) size -= 0.5;
  if (size < max) el.style.fontSize = size + 'px';
}

function fitTitleFields() {
  ['book-title-field', 'chapter-title-field', 'chapter-dates-field']
    .forEach(id => fitTitleField(document.getElementById(id)));
}

// Fitting once at load is not enough: the reader area also changes width when
// the panel is collapsed or reopened (which init does on phones, right after
// the first fit) and when the TOC drawer moves. Measuring at the wrong moment
// shrank a short date line to the 10px floor and left it there.
let lastTitleFitWidth = 0;
function observeTitleFit() {
  // The very first measurement is the one most likely to be wrong: it can run
  // before the final layout or before the font metrics are settled, and a
  // too-early measurement shrinks a title that would have fit and then leaves
  // it there. Re-fit once after paint, and again once fonts report ready.
  requestAnimationFrame(() => fitTitleFields());
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => fitTitleFields()).catch(() => {});
  }

  const box = document.querySelector('.reader-inner');
  if (!box || typeof ResizeObserver === 'undefined') return;
  new ResizeObserver((entries) => {
    // Width only. Refitting changes the type size, which changes this box's
    // height, which would otherwise re-trigger the observer forever.
    const w = Math.round(entries[0].contentRect.width);
    if (w === lastTitleFitWidth) return;
    lastTitleFitWidth = w;
    fitTitleFields();
  }).observe(box);
}

function syncTitleFieldsFromState() {
  const bookEl = document.getElementById('book-title-field');
  const chapterEl = document.getElementById('chapter-title-field');
  const datesEl = document.getElementById('chapter-dates-field');
  const addBtn = document.getElementById('btn-add-dates');
  if (bookEl) bookEl.value = bookTitle;
  if (chapterEl) chapterEl.value = chapterTitle;
  if (datesEl) datesEl.value = chapterDates;
  // Not every book/chapter has a subtitle or date range (e.g. a Vorwort) --
  // showing an empty box with a placeholder for it every time reads oddly,
  // so it's hidden until there's content, with a small affordance to add one.
  const hasDates = !!chapterDates;
  if (datesEl) datesEl.classList.toggle('hidden', !hasDates);
  if (addBtn) addBtn.classList.toggle('hidden', hasDates);
  fitTitleFields();
}

function populateChapterSelect() {
  const sel = document.getElementById('chapter-select');
  if (!sel) return;
  sel.innerHTML = '';
  chapters.forEach((ch, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = (ch.title || t('book.chapterFallback', { n: i + 1 })) + (ch.dateRange ? ` · ${ch.dateRange}` : '');
    sel.appendChild(opt);
  });
  sel.value = String(currentChapterIndex);
}

function renderTocList() {
  const list = document.getElementById('toc-list');
  if (!list) return;
  list.innerHTML = '';
  chapters.forEach((ch, i) => {
    const li = document.createElement('li');
    li.className = 'toc-item' + (i === currentChapterIndex ? ' current' : '');
    li.innerHTML = `<span class="toc-title">${escapeHtml(ch.title || t('book.chapterFallback', { n: i + 1 }))}</span><span class="toc-dates">${escapeHtml(ch.dateRange || '')}</span>`;
    li.addEventListener('click', () => switchChapter(i));
    list.appendChild(li);
  });
}

// ============================================================
// Document library (settings > 文档 tab)
// ============================================================
function renderDocLibraryList() {
  const list = document.getElementById('doc-library-list');
  if (!list) return;
  list.innerHTML = '';
  const index = loadDocIndex();
  // The example is a build constant rather than a stored document, so its row
  // is synthesised here -- unless the reader deleted it, in which case it is
  // gone from the list until the "restore example" button below brings it back.
  const builtinEntry = isExampleRemoved()
    ? []
    : [{ id: BOOK_DOC_ID, title: BOOK_TITLE, chapterCount: BOOK_CHAPTERS.length, builtin: true }];
  const entries = builtinEntry
    .concat(index.filter(d => d.id !== BOOK_DOC_ID))
    .sort((a, b) => (a.builtin ? -1 : b.builtin ? 1 : (b.savedAt || 0) - (a.savedAt || 0)));

  entries.forEach(entry => {
    const li = document.createElement('li');
    li.className = 'doc-library-item' + (entry.id === currentDocId ? ' current' : '');
    const meta = entry.builtin
      ? t('settings.libraryBuiltin')
      : t('settings.libraryChapterCount', { n: entry.chapterCount || 0 });
    li.innerHTML = `
      <div class="doc-library-item-main">
        <div class="doc-library-item-title">${escapeHtml(entry.title || t('settings.libraryUntitled'))}</div>
        <div class="doc-library-item-meta">${meta}<span class="doc-library-item-size"></span></div>
      </div>
      <button class="doc-library-item-cache" title="${escapeHtml(t('settings.libraryClearCache'))}"
              aria-label="${escapeHtml(t('settings.libraryClearCache'))}">⟳</button>
      <button class="doc-library-item-export" title="${escapeHtml(t('settings.libraryExport'))}"
              aria-label="${escapeHtml(t('settings.libraryExport'))}">⇩</button>
      <button class="doc-library-item-delete" title="${escapeHtml(t('settings.libraryDelete'))}"
              aria-label="${escapeHtml(t('settings.libraryDelete'))}">✕</button>
    `;
    li.querySelector('.doc-library-item-main').addEventListener('click', async () => {
      await switchToDocument(entry.id);
      syncSettingsFormFromState();
    });
    li.querySelector('.doc-library-item-cache').addEventListener('click', async (e) => {
      e.stopPropagation();
      await clearDocumentCache(entry.id);
      setImportStatus(t('cache.clearedDoc', { title: entry.title || t('settings.libraryUntitled') }), 'success');
      renderStorageUsage();
    });
    li.querySelector('.doc-library-item-export').addEventListener('click', async (e) => {
      e.stopPropagation();
      await exportDocumentVocabToCsv(entry.id, entry.title);
    });
    li.querySelector('.doc-library-item-delete').addEventListener('click', async (e) => {
      e.stopPropagation();
      await deleteDocumentFromLibrary(entry.id);
      syncSettingsFormFromState();
    });
    list.appendChild(li);
    // The built-in book is part of the build, not stored text -- it costs
    // nothing until it has been edited, so don't put a size on its row.
    if (!entry.builtin) annotateDocSize(li, entry.id);
  });

  const restoreBtn = document.getElementById('btn-restore-example');
  if (restoreBtn) restoreBtn.classList.toggle('hidden', !isExampleRemoved());
  renderStorageUsage();
}

// Sizes come from async storage, so they arrive after the row is on screen.
function annotateDocSize(li, id) {
  documentStoredSize(id).then(bytes => {
    if (!bytes || !li.isConnected) return;
    const el = li.querySelector('.doc-library-item-size');
    if (el) el.textContent = ' · ' + formatBytes(bytes);
  }).catch(() => {});
}

// How much room the library is taking, and where it is being kept. The point
// is that localStorage gives no way to ask this, so a reader who filled it had
// no way to find out short of the import failing.
function renderStorageUsage() {
  const el = document.getElementById('storage-usage');
  if (!el) return;
  blobUsage().then(({ backend, bytes, limit }) => {
    el.textContent = limit
      ? t('storage.usageLimited', { used: formatBytes(bytes), limit: formatBytes(limit), backend })
      : t('storage.usage', { used: formatBytes(bytes), backend });
  }).catch(() => {});
}

function toggleToc() {
  const sidebar = document.getElementById('toc-sidebar');
  const backdrop = document.getElementById('toc-backdrop');
  if (!sidebar) return;
  const willShow = !sidebar.classList.contains('open');
  if (willShow) renderTocList();
  sidebar.classList.toggle('open');
  if (backdrop) backdrop.classList.toggle('open');
}

function hideToc() {
  const sidebar = document.getElementById('toc-sidebar');
  const backdrop = document.getElementById('toc-backdrop');
  if (sidebar) sidebar.classList.remove('open');
  if (backdrop) backdrop.classList.remove('open');
}

function wireToc() {
  const btn = document.getElementById('btn-toggle-toc');
  if (btn) btn.addEventListener('click', toggleToc);
  const closeBtn = document.getElementById('btn-close-toc');
  if (closeBtn) closeBtn.addEventListener('click', hideToc);
  const backdrop = document.getElementById('toc-backdrop');
  if (backdrop) backdrop.addEventListener('click', hideToc);
}

// ============================================================
// Keyboard shortcuts
// ============================================================
function isTypingTarget(el) {
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
}

function wireKeyboardShortcuts() {
  document.addEventListener('keydown', (e) => {
    if (isTypingTarget(document.activeElement)) return;

    if (e.key === 'Escape') {
      const settingsOpen = !document.getElementById('settings-overlay').classList.contains('hidden');
      if (settingsOpen) { closeSettings(); return; }
      if (!panelEl.classList.contains('collapsed')) { togglePanel(); return; }
      hideToc();
      return;
    }

    const settingsOpen = !document.getElementById('settings-overlay').classList.contains('hidden');
    if (settingsOpen) return;

    if (e.key === 'ArrowLeft' || e.key === 'h') {
      e.preventDefault();
      turnPage(-1);
    } else if (e.key === 'ArrowRight' || e.key === 'l') {
      e.preventDefault();
      turnPage(1);
    }
  });
}

// ============================================================
// Panel toggle
// ============================================================
const panelEl = document.getElementById('panel');

// Shared by "close the panel" and "tap blank space in the reader" -- both mean
// the reader is done with that sentence, so the highlight left glowing after
// either one would be stale, not a record of what's still being discussed.
function clearActiveSentence() {
  if (!activeSpan) return;
  spansForSentence(activeSpan.dataset.sid).forEach((el) => el.classList.remove('active'));
  activeSpan = null;
}

function togglePanel() {
  panelEl.classList.toggle('collapsed');
  // A bottom-sheet drag leaves an inline pixel height behind, and an inline
  // height wins over .panel.collapsed's. Left in place, dismissing the sheet
  // set the class and changed nothing on screen -- the panel stayed exactly
  // where it was until the page was reloaded, which is how it was reported.
  // Clearing it here also means reopening starts from the CSS default height
  // rather than resuming whatever the last drag happened to leave.
  panelEl.style.height = '';
  const btn = document.getElementById('btn-toggle-panel');
  const collapsed = panelEl.classList.contains('collapsed');
  btn.textContent = collapsed ? t('toolbar.showSidebar') : t('toolbar.hideSidebar');
  if (collapsed) clearActiveSentence();
}

// ============================================================
// Bottom-sheet drag (the panel's mobile-portrait layout only -- landscape
// and desktop keep the fixed-width sidebar, where dragging a height makes no
// sense). Freeform, no snap points: the drag just moves panelEl's own height
// between a floor and a near-fullscreen ceiling, and releasing it below the
// floor dismisses the panel the same way the close button does, rather than
// leaving it stuck open at a sliver.
//
// The whole header is the handle, not just the visible bar. Aiming for a 22px
// strip is a fussy target on a phone, and the header looks like one solid
// grabbable thing -- so a drag that started anywhere else on it did nothing
// except scroll the sheet's contents to their top and rubber-band back, which
// reads as the sheet refusing to move.
// ============================================================
const PANEL_SHEET_QUERY = '(max-width: 900px) and (orientation: portrait)';
function isPanelSheet() {
  return window.matchMedia(PANEL_SHEET_QUERY).matches;
}

function wirePanelDrag() {
  const handle = document.getElementById('panel-header');
  if (!handle) return;
  let dragging = false;
  let startY = 0;
  let startHeight = 0;
  // The height the drag last asked for. Read back at release instead of
  // measuring the element: by then the transition is being re-enabled, and a
  // measurement taken across that boundary can report the height the sheet is
  // animating *from* rather than the one the finger left it at.
  let draggedHeight = 0;
  // Sampled over the last stretch of the gesture, in px/ms. A sheet that can
  // only be dismissed by dragging it all the way past a position threshold
  // feels dead: a quick flick downwards is how people expect to throw one of
  // these away, and it should not matter that the finger let go halfway.
  let velocity = 0;
  let lastY = 0;
  let lastT = 0;

  handle.addEventListener('pointerdown', (e) => {
    if (!isPanelSheet()) return;
    // The dismiss button lives in the handle. A press on it is a press on it.
    if (e.target.closest && e.target.closest('.panel-close')) return;
    dragging = true;
    startY = e.clientY;
    startHeight = panelEl.getBoundingClientRect().height;
    draggedHeight = startHeight;
    velocity = 0;
    lastY = e.clientY;
    lastT = e.timeStamp;
    // The height transition is for open/close; during a drag it would make
    // the sheet trail 220ms behind the finger.
    panelEl.classList.add('panel-dragging');
    handle.setPointerCapture(e.pointerId);
  });

  handle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const deltaY = startY - e.clientY; // dragging up shortens deltaY's sign, growing the panel
    const minHeight = window.innerHeight * 0.32;
    const maxHeight = window.innerHeight * 0.94;
    draggedHeight = Math.min(maxHeight, Math.max(minHeight, startHeight + deltaY));
    panelEl.style.height = draggedHeight + 'px';

    // Smoothed, so one jittery sample near the end of the gesture cannot
    // decide the outcome on its own. Positive means the finger is moving down.
    const dt = e.timeStamp - lastT;
    if (dt > 0) {
      const sample = (e.clientY - lastY) / dt;
      velocity = velocity ? velocity * 0.4 + sample * 0.6 : sample;
      lastY = e.clientY;
      lastT = e.timeStamp;
    }
  });

  // px/ms. Roughly the slowest movement that still reads as a flick rather
  // than as placing the sheet somewhere on purpose -- a deliberate drag runs
  // well under this even when it covers a lot of distance.
  const FLING_SPEED = 0.45;

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    panelEl.classList.remove('panel-dragging');

    // Thrown downwards: dismiss from wherever it is. Thrown upwards: take it
    // to full height, which is the other thing a flick can mean and would
    // otherwise require dragging the whole way by hand.
    if (velocity > FLING_SPEED) {
      panelEl.style.height = '';
      if (!panelEl.classList.contains('collapsed')) togglePanel();
      return;
    }
    if (velocity < -FLING_SPEED) {
      panelEl.style.height = window.innerHeight * 0.94 + 'px';
      return;
    }
    // Let go without much speed: where it ended up is what was meant, so the
    // position threshold decides. Slightly above the drag floor, so that
    // dragging it as far down as it goes and stopping still dismisses.
    if (draggedHeight <= window.innerHeight * 0.34) {
      panelEl.style.height = ''; // back to the CSS default for next time
      if (!panelEl.classList.contains('collapsed')) togglePanel();
    }
  }
  handle.addEventListener('pointerup', endDrag);
  handle.addEventListener('pointercancel', endDrag);

  // Rotating to landscape (or resizing past the breakpoint) while a drag has
  // left an inline pixel height behind must not leave that height fighting
  // the sidebar layout's own CSS afterwards.
  window.matchMedia(PANEL_SHEET_QUERY).addEventListener('change', (e) => {
    if (!e.matches) panelEl.style.height = '';
  });
}

// ============================================================
// Click handling + caching
// ============================================================
async function onSentenceClick(span, sentenceText) {
  // Third stage of the tap probe (touchstart -> click -> here). No-op unless
  // server.py --debug-log served this page; see installDebugProbes.
  debugLog('onSentenceClick', { sid: span.dataset.sid, page: currentPage, len: sentenceText.length });
  // A sentence interrupted by a footnote is rendered as several spans; the
  // whole sentence must light up, not just the half that was clicked.
  clearActiveSentence();
  spansForSentence(span.dataset.sid).forEach((el) => el.classList.add('active'));
  activeSpan = span;

  if (panelEl.classList.contains('collapsed')) togglePanel();

  const cacheKey = cacheKeyFor(sentenceText);
  const paraIdx = parseInt(span.dataset.paraIdx, 10);
  const contextParagraph = Number.isFinite(paraIdx) ? PARAGRAPHS[paraIdx] : '';
  renderQuote(sentenceText);
  // Show the spinner *before* any await. Everything below can take a moment or
  // bail out, and until this call the panel still displays the "click a
  // sentence" placeholder -- so a tap that was received looked exactly like a
  // tap that was never received. That is indistinguishable from the app being
  // broken, and was reported as exactly that.
  renderLoading();

  // A click within the first few milliseconds of opening a chapter would
  // otherwise read an empty map and pay for an analysis already on disk.
  await cacheWarmPromise;
  if (activeSpan !== span) return; // moved on while waiting

  if (cache.has(cacheKey)) {
    renderResult(cache.get(cacheKey), sentenceText);
    return;
  }
  try {
    const result = await analyzeSentence(sentenceText, contextParagraph);
    cache.set(cacheKey, result);
    persistCacheDebounced();
    if (activeSpan === span) renderResult(result, sentenceText);
  } catch (err) {
    const errResult = { error: (err && err.message) || String(err) };
    // A timeout or dropped connection says nothing about this sentence, so
    // caching it would make one bad moment look permanent: the reader would
    // come back later, see the stale error again, and have to find the retry
    // button. Configuration errors (bad key, bad request) do get cached --
    // they'll reproduce anyway, and re-asking just burns quota.
    if (!(err && err.transient)) {
      cache.set(cacheKey, errResult);
    }
    if (activeSpan === span) renderResult(errResult, sentenceText);
  }
}

// Throws away the cached analysis of the sentence in the panel and asks again.
// Used both by the error-state retry button and by the "re-analyse" button on a
// successful result (the reader didn't like the answer, or switched model and
// wants this one sentence redone rather than the whole cache emptied).
// The span's own text is only one segment of the sentence -- the full analysed
// text has to be used or it would key a different cache entry.
function reanalyzeActiveSentence() {
  if (!activeSpan) return;
  const full = sentenceTexts.get(Number(activeSpan.dataset.sid)) || activeSpan.textContent;
  cache.delete(cacheKeyFor(full));
  persistCacheDebounced(); // don't let the discarded entry survive a reload
  onSentenceClick(activeSpan, full);
}

function renderQuote(text) {
  const q = document.getElementById('panel-quote');
  q.style.display = 'block';
  q.textContent = text;
}

function renderLoading() {
  const body = document.getElementById('panel-body');
  // aria-busy tells assistive tech the region is mid-update, so it waits and
  // announces the finished analysis instead of the spinner
  body.setAttribute('aria-busy', 'true');
  body.innerHTML = `<div class="loading-row"><div class="spinner"></div>${t('panel.loading')}</div>`;
}

function renderResult(result, sentenceText) {
  const panelBody = document.getElementById('panel-body');
  if (panelBody) panelBody.setAttribute('aria-busy', 'false');
  const body = document.getElementById('panel-body');
  if (result.error) {
    body.innerHTML = `
      <div class="error-box">${escapeHtml(result.error)}</div>
      <button class="retry-btn" id="retry-btn">${t('panel.retry')}</button>
    `;
    const retryBtn = document.getElementById('retry-btn');
    if (retryBtn) retryBtn.addEventListener('click', reanalyzeActiveSentence);
    return;
  }

  // history[0]/[1] are the first structured Q&A (already shown via the tabs
  // above); anything after that is follow-up chat.
  const followUps = (result.history || []).slice(2);

  body.innerHTML = `
    <div class="section-tabs" role="tablist" aria-label="${escapeHtml(t('panel.title'))}">
      <button class="tab-btn active" data-tab="grammar" role="tab"
              id="tab-grammar" aria-controls="tabpanel-grammar"
              aria-selected="true" tabindex="0">${t('panel.tabGrammar')}</button>
      <button class="tab-btn" data-tab="vocab" role="tab"
              id="tab-vocab" aria-controls="tabpanel-vocab"
              aria-selected="false" tabindex="-1">${t('panel.tabVocab')}</button>
      <button class="reanalyze-btn" id="reanalyze-btn" title="${escapeHtml(t('panel.reanalyze'))}"
              aria-label="${escapeHtml(t('panel.reanalyze'))}">⟳</button>
    </div>
    <div class="tab-panel active" data-tab="grammar" role="tabpanel"
         id="tabpanel-grammar" aria-labelledby="tab-grammar"><div class="analysis-md">${result.grammarHtml}</div></div>
    <div class="tab-panel" data-tab="vocab" role="tabpanel"
         id="tabpanel-vocab" aria-labelledby="tab-vocab"><div class="analysis-md">${result.vocabHtml}</div></div>
    <div class="chat-section">
      <div class="chat-thread" id="chat-thread">${renderChatTurns(followUps)}</div>
      <div class="chat-input-row">
        <textarea id="chat-input" rows="1" placeholder="${escapeHtml(t('chat.placeholder'))}"></textarea>
        <button id="chat-send-btn" class="btn primary">${t('chat.send')}</button>
      </div>
    </div>
  `;
  const tabs = [...body.querySelectorAll('.tab-btn')];

  // Roving tabindex: the tablist is one Tab stop and the arrow keys move
  // between tabs inside it, which is what a screen-reader user expects of
  // role="tablist" -- and what makes Tab still reach the chat box in one press
  // instead of two.
  function selectTab(btn, { focus = false } = {}) {
    tabs.forEach(b => {
      const on = b === btn;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    });
    body.querySelectorAll('.tab-panel').forEach(p => {
      p.classList.toggle('active', p.dataset.tab === btn.dataset.tab);
    });
    if (focus) btn.focus();
  }

  tabs.forEach((btn, i) => {
    btn.addEventListener('click', () => selectTab(btn));
    btn.addEventListener('keydown', (e) => {
      const step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (step) {
        e.preventDefault();
        selectTab(tabs[(i + step + tabs.length) % tabs.length], { focus: true });
        return;
      }
      if (e.key === 'Home' || e.key === 'End') {
        e.preventDefault();
        selectTab(e.key === 'Home' ? tabs[0] : tabs[tabs.length - 1], { focus: true });
      }
    });
  });

  const reanalyzeBtn = document.getElementById('reanalyze-btn');
  if (reanalyzeBtn) reanalyzeBtn.addEventListener('click', reanalyzeActiveSentence);

  const thread = document.getElementById('chat-thread');
  if (thread) thread.scrollTop = thread.scrollHeight;
  wireChatInput(result, sentenceText);
}

function renderChatTurns(turns) {
  let html = '';
  for (let i = 0; i < turns.length; i += 2) {
    const userMsg = turns[i];
    const assistantMsg = turns[i + 1];
    if (userMsg) html += `<div class="chat-bubble chat-user">${escapeHtml(userMsg.content)}</div>`;
    if (assistantMsg) html += `<div class="chat-bubble chat-assistant"><div class="analysis-md">${mdToHtml(assistantMsg.content)}</div></div>`;
  }
  return html;
}

function wireChatInput(result, sentenceText) {
  const btn = document.getElementById('chat-send-btn');
  const input = document.getElementById('chat-input');
  const thread = document.getElementById('chat-thread');
  if (!btn || !input || !thread) return;

  const send = async () => {
    const msg = input.value.trim();
    if (!msg || btn.disabled) return;
    input.value = '';
    btn.disabled = true;

    thread.insertAdjacentHTML('beforeend', `<div class="chat-bubble chat-user">${escapeHtml(msg)}</div>`);
    thread.insertAdjacentHTML('beforeend', `<div class="chat-bubble chat-assistant chat-pending" id="chat-pending"><div class="spinner"></div></div>`);
    thread.scrollTop = thread.scrollHeight;

    try {
      const responseText = await sendFollowUp(result, msg);
      const pending = document.getElementById('chat-pending');
      if (pending) pending.outerHTML = `<div class="chat-bubble chat-assistant"><div class="analysis-md">${mdToHtml(responseText)}</div></div>`;
      const cacheKey = cacheKeyFor(sentenceText);
      cache.set(cacheKey, result);
      persistCacheDebounced();
    } catch (err) {
      const pending = document.getElementById('chat-pending');
      const msgText = (err && err.message) || String(err);
      if (pending) pending.outerHTML = `<div class="chat-bubble chat-assistant chat-error">${escapeHtml(msgText)}</div>`;
    } finally {
      btn.disabled = false;
      thread.scrollTop = thread.scrollHeight;
    }
  };

  btn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function mdToHtml(md) {
  if (!md) return '';
  const lines = md.split('\n');
  let html = '';
  let inList = false;
  let listType = null;

  function closeList() {
    if (inList) { html += listType === 'ol' ? '</ol>' : '</ul>'; inList = false; listType = null; }
  }

  for (let raw of lines) {
    const line = raw.trim();
    if (!line) { closeList(); continue; }
    let m;
    if ((m = line.match(/^####\s+(.*)/))) { closeList(); html += `<h4>${inlineMd(m[1])}</h4>`; continue; }
    if ((m = line.match(/^###\s+(.*)/))) { closeList(); html += `<h4>${inlineMd(m[1])}</h4>`; continue; }
    if ((m = line.match(/^##\s+(.*)/))) { closeList(); html += `<h3>${inlineMd(m[1])}</h3>`; continue; }
    if ((m = line.match(/^#\s+(.*)/))) { closeList(); html += `<h3>${inlineMd(m[1])}</h3>`; continue; }
    if ((m = line.match(/^[-*]\s+(.*)/))) {
      if (!inList || listType !== 'ul') { closeList(); html += '<ul>'; inList = true; listType = 'ul'; }
      html += `<li>${inlineMd(m[1])}</li>`;
      continue;
    }
    if ((m = line.match(/^\d+\.\s+(.*)/))) {
      if (!inList || listType !== 'ol') { closeList(); html += '<ol>'; inList = true; listType = 'ol'; }
      html += `<li>${inlineMd(m[1])}</li>`;
      continue;
    }
    // Indented continuation of the current bullet (markdown "lazy" continuation
    // lines). The per-clause translation lines the prompt now asks for arrive
    // exactly this way; without this they would close the list and render as a
    // stray paragraph, with every following bullet starting a fresh <ul>.
    if (inList && /^\s/.test(raw) && html.endsWith('</li>')) {
      html = html.slice(0, -'</li>'.length) + `<br>${inlineMd(line)}</li>`;
      continue;
    }
    closeList();
    html += `<p>${inlineMd(line)}</p>`;
  }
  closeList();
  return html;
}

function inlineMd(text) {
  let t = escapeHtml(text);
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/`(.+?)`/g, '<code>$1</code>');
  t = t.replace(/\*(.+?)\*/g, '<span class="de">$1</span>');
  return t;
}

const OUTPUT_LANG_NAMES = {
  cs: 'Čeština',
