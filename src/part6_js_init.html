<script>
"use strict";

// ============================================================
// UI language switcher
// ============================================================
function populateUiLangChips() {
  const row = document.getElementById('ui-lang-chips');
  if (!row) return;
  const active = resolveUiLang();
  row.innerHTML = '';
  UI_LANGS.forEach(code => {
    const chip = document.createElement('div');
    chip.className = 'radio-chip' + (code === active ? ' selected' : '');
    chip.dataset.uilang = code;
    // Each language is named in itself, so the chip stays recognisable to
    // someone who cannot read the language the UI is currently in.
    chip.textContent = UI_LANG_NAMES[code] || code;
    row.appendChild(chip);
  });
}

function refreshUiLanguage() {
  applyI18n();
  // Built in JS, so data-i18n can't reach it -- it has to be rebuilt by hand.
  syncProxyHints();
  updatePagerUI();
  renderTocList();
  populateChapterSelect();
}

// Applies (and saves) immediately on pick rather than waiting for Save, which
// is what the old <select> did too: the whole dialog is written in the
// language being chosen, so seeing the change at once is the confirmation
// that the right one was picked.
function wireUiLangChips() {
  wireRadioGroup('ui-lang-chips', (chip) => {
    settings.uiLang = chip.dataset.uilang;
    saveSettingsToLocalStorage();
    refreshUiLanguage();
  });
}

// ============================================================
// Settings modal wiring
// ============================================================
// Focus handling for the settings dialog. Without it a keyboard or screen
// reader user opens the dialog and their focus is still out in the page
// behind it -- they tab through the whole reader before reaching any control,
// and never learn the dialog opened at all.
let settingsReturnFocus = null;

function focusableInSettings() {
  return [...document.querySelectorAll(
    '#settings-overlay button, #settings-overlay input, #settings-overlay select, #settings-overlay textarea, #settings-overlay [tabindex]:not([tabindex="-1"])'
  )].filter(el => !el.disabled && el.offsetParent !== null);
}

function openSettings() {
  settingsReturnFocus = document.activeElement;
  document.getElementById('settings-overlay').classList.remove('hidden');
  syncSettingsFormFromState();
  const first = focusableInSettings()[0];
  if (first) first.focus();
}
function closeSettings() {
  document.getElementById('settings-overlay').classList.add('hidden');
  // hand focus back to whatever opened the dialog, not to the top of the page
  if (settingsReturnFocus && typeof settingsReturnFocus.focus === 'function') {
    settingsReturnFocus.focus();
  }
  settingsReturnFocus = null;
}

// Keep Tab inside the dialog while it is open.
function wireSettingsFocusTrap() {
  document.getElementById('settings-overlay').addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    const items = focusableInSettings();
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });
}

function syncProviderFieldsVisibility() {
  ['anthropic', 'openai', 'gemini'].forEach(p => {
    document.getElementById('provider-fields-' + p).classList.toggle('hidden', p !== settings.provider);
  });
}

// The chip rows are radio groups in everything but markup: exactly one choice,
// mutually exclusive. As bare <div>s they were unreachable by keyboard and
// silent to a screen reader. Roles and arrow-key handling are added here, in
// one place, instead of five copies of the same click wiring.
//
// Selection state still lives in the .selected class, because several other
// code paths set it directly; syncRadioGroupAria derives the ARIA state from
// that class so the two cannot drift apart.
function syncRadioGroupAria(container) {
  const chips = [...container.querySelectorAll('.radio-chip')];
  const selected = chips.find(c => c.classList.contains('selected'));
  chips.forEach(chip => {
    const on = chip === selected;
    chip.setAttribute('aria-checked', on ? 'true' : 'false');
    // Roving tabindex: one Tab stop per group, arrows move inside it. The
    // fallback keeps a group with nothing selected reachable at all.
    chip.tabIndex = (on || (!selected && chip === chips[0])) ? 0 : -1;
  });
}

function syncAllRadioGroupAria() {
  document.querySelectorAll('.radio-row').forEach(syncRadioGroupAria);
}

function wireRadioGroup(containerId, onSelect) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.setAttribute('role', 'radiogroup');

  // Point at the live <label> element rather than copying its text, so the
  // accessible name follows a UI-language switch instead of going stale.
  const label = container.parentElement && container.parentElement.querySelector('label');
  if (label) {
    if (!label.id) label.id = containerId + '-label';
    container.setAttribute('aria-labelledby', label.id);
  }

  const chips = [...container.querySelectorAll('.radio-chip')];

  function select(chip, { focus = false } = {}) {
    chips.forEach(c => c.classList.toggle('selected', c === chip));
    syncRadioGroupAria(container);
    if (focus) chip.focus();
    if (onSelect) onSelect(chip);
  }

  chips.forEach((chip, i) => {
    chip.setAttribute('role', 'radio');
    chip.addEventListener('click', () => select(chip));
    chip.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        select(chip);
        return;
      }
      const step = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1
        : (e.key === 'ArrowLeft' || e.key === 'ArrowUp') ? -1 : 0;
      if (!step) return;
      // Arrow keys in a radio group move *and* select, which is the standard
      // behaviour and what makes the group usable without a pointer.
      e.preventDefault();
      select(chips[(i + step + chips.length) % chips.length], { focus: true });
    });
  });
  syncRadioGroupAria(container);
}

// Show, per provider, the Base URL that routes through the server.py instance
// serving this page -- but only when there is something to say: the proxy has
// to be there, it must not already hold that provider's key (then the Base URL
// is supplied automatically), and the field must not already point at it.
// Reads the input rather than `settings` so the hint disappears the moment the
// button fills it in, before anything is saved.
function syncProxyHints() {
  document.querySelectorAll('[data-proxy-hint]').forEach(el => {
    const provider = el.dataset.proxyHint;
    const info = proxyRelayInfoFor(provider);
    const input = document.getElementById(provider + '-baseurl-input');
    const target = info ? info.baseUrl.replace(/\/+$/, '') : '';
    const already = !!info && input && input.value.trim().replace(/\/+$/, '') === target;
    el.textContent = '';
    el.classList.toggle('hidden', !info || already);
    if (!info || already) return;
    el.appendChild(document.createTextNode(t('settings.proxyRelayHint', { url: info.baseUrl }) + ' '));
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn';
    btn.textContent = t('settings.proxyFillBtn');
    btn.addEventListener('click', () => {
      input.value = info.baseUrl;
      syncProxyHints();
      input.focus();
    });
    el.appendChild(btn);
  });
}

function syncSettingsFormFromState() {
  document.querySelectorAll('#provider-chips .radio-chip').forEach(chip => {
    chip.classList.toggle('selected', chip.dataset.provider === settings.provider);
  });
  syncProviderFieldsVisibility();
  document.getElementById('anthropic-key-input').value = settings.providers.anthropic.apiKey || '';
  document.getElementById('anthropic-model-input').value = settings.providers.anthropic.model || PROVIDER_DEFAULTS.anthropic.model;
  document.getElementById('anthropic-baseurl-input').value = settings.providers.anthropic.baseUrl || '';
  document.getElementById('openai-key-input').value = settings.providers.openai.apiKey || '';
  document.getElementById('openai-baseurl-input').value = settings.providers.openai.baseUrl || PROVIDER_DEFAULTS.openai.baseUrl;
  document.getElementById('openai-model-input').value = settings.providers.openai.model || PROVIDER_DEFAULTS.openai.model;
  document.getElementById('gemini-key-input').value = settings.providers.gemini.apiKey || '';
  document.getElementById('gemini-baseurl-input').value = settings.providers.gemini.baseUrl || PROVIDER_DEFAULTS.gemini.baseUrl;
  document.getElementById('gemini-model-input').value = settings.providers.gemini.model || PROVIDER_DEFAULTS.gemini.model;
  syncProxyHints();

  document.getElementById('paras-per-page-input').value = settings.parasPerPage || 8;

  document.querySelectorAll('#ui-lang-chips .radio-chip').forEach(chip => {
    chip.classList.toggle('selected', chip.dataset.uilang === resolveUiLang());
  });
  document.querySelectorAll('#lang-rule-chips .radio-chip').forEach(chip => {
    chip.classList.toggle('selected', chip.dataset.lang === settings.sentenceLang);
  });
  document.querySelectorAll('#output-lang-chips .radio-chip').forEach(chip => {
    chip.classList.toggle('selected', chip.dataset.outlang === settings.outputLang);
  });
  document.getElementById('output-lang-custom-input').style.display =
    settings.outputLang === 'custom' ? 'block' : 'none';
  document.getElementById('output-lang-custom-input').value = settings.customOutputLang || '';

  document.querySelectorAll('#pagination-mode-chips .radio-chip').forEach(chip => {
    chip.classList.toggle('selected', chip.dataset.mode === settings.paginationMode);
  });
  document.getElementById('paras-per-page-wrap').style.display =
    settings.paginationMode === 'none' ? 'none' : 'block';

  document.querySelectorAll('#theme-chips .radio-chip').forEach(chip => {
    chip.classList.toggle('selected', chip.dataset.theme === (settings.theme || 'light'));
  });
  document.getElementById('font-family-select').value = settings.fontFamily || 'serif';
  document.getElementById('font-size-input').value = settings.fontSize || 19;
  document.getElementById('font-size-value').textContent = (settings.fontSize || 19) + 'px';

  // Every block above sets .selected directly, so re-derive the ARIA state
  // from it once here rather than at each site.
  syncAllRadioGroupAria();

  populateChapterSelect();
  renderDocLibraryList();
  document.getElementById('raw-text-area').value = paragraphsToText(PARAGRAPHS);
}

// ============================================================
// Theme + font application (CSS custom properties on <html>)
// ============================================================
const FONT_FAMILY_VALUES = {
  serif: 'var(--serif)',
  sans: 'var(--sans)',
  mono: '"SF Mono", Consolas, "Courier New", monospace',
};

// Only the reader's own choice (the settings-save path) should cross-fade --
// the very first call, at startup, must land on the right theme in the first
// frame, not fade into it from whatever the stylesheet's default is.
const THEME_TRANSITION_MS = 180;
let themeTransitionTimer = null;
function applyTheme(animate) {
  const root = document.documentElement;
  if (animate && !prefersReducedMotion()) {
    root.classList.add('theme-transition');
    clearTimeout(themeTransitionTimer);
    themeTransitionTimer = setTimeout(() => root.classList.remove('theme-transition'), THEME_TRANSITION_MS + 30);
  }
  if (settings.theme) {
    root.dataset.theme = settings.theme;
  } else {
    delete root.dataset.theme;
  }
}

function applyFont() {
  document.documentElement.style.setProperty('--reading-font-family', FONT_FAMILY_VALUES[settings.fontFamily] || FONT_FAMILY_VALUES.serif);
  document.documentElement.style.setProperty('--reading-font-size', (settings.fontSize || 19) + 'px');
}

// The four settings tabs hold very different amounts of content -- the
// language tab is three long chip rows, the document tab is a short list --
// so switching between them resized the dialog instantly, and because the
// dialog is centred in the overlay it jumped in both directions at once.
// Running `mutate` between two measurements and animating across the
// difference turns that jump into the dialog growing or shrinking to fit.
const MODAL_RESIZE_MS = 200;

function animateModalResize(modal, mutate) {
  if (!modal) { mutate(); return; }
  const before = modal.getBoundingClientRect().height;
  mutate();
  // Cleared first in case a previous switch is still animating, so `after` is
  // the natural height of the new content rather than a frozen mid-animation
  // one.
  modal.style.height = '';
  const after = modal.getBoundingClientRect().height;
  if (before === after || prefersReducedMotion()) return;

  const restoreOverflow = modal.style.overflowY;
  modal.style.overflowY = 'hidden';
  modal.style.height = before + 'px';
  void modal.offsetHeight; // commit the start height before the transition
  modal.style.transition = `height ${MODAL_RESIZE_MS}ms cubic-bezier(.22, .61, .36, 1)`;
  modal.style.height = after + 'px';
  clearTimeout(modal.__resizeTimer);
  modal.__resizeTimer = setTimeout(() => {
    // Back to auto: the dialog has to stay able to grow on its own afterwards
    // (a custom-language field appearing, the window being resized).
    modal.style.transition = '';
    modal.style.height = '';
    modal.style.overflowY = restoreOverflow;
  }, MODAL_RESIZE_MS + 30);
}

function wireSettingsTabs() {
  const modal = document.querySelector('#settings-overlay .modal');
  document.querySelectorAll('.settings-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      animateModalResize(modal, () => {
        document.querySelectorAll('.settings-tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.settings-tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.querySelector(`.settings-tab-panel[data-settings-tab="${btn.dataset.settingsTab}"]`).classList.add('active');
      });
    });
  });
}

// Model <input list="..."> fields only show their <datalist> suggestions
// unfiltered when the field is empty -- with existing text in it, the
// browser filters the list down to substring/prefix matches (or shows
// nothing at all if the current value doesn't match any option), which
// reads as "the dropdown won't open". Clearing the field on focus and
// restoring it on blur (if nothing was picked/typed) gives the always-see-
// all-options behavior users expect from a combobox.
function wireModelSuggestionInputs() {
  ['anthropic-model-input', 'openai-model-input', 'gemini-model-input'].forEach(id => {
    const input = document.getElementById(id);
    if (!input) return;
    input.addEventListener('focus', () => {
      input.dataset.prevValue = input.value;
      input.value = '';
    });
    input.addEventListener('blur', () => {
      if (input.value.trim() === '' && input.dataset.prevValue) {
        input.value = input.dataset.prevValue;
      }
      delete input.dataset.prevValue;
    });
  });
}

function wireSettingsModal() {
  document.getElementById('btn-open-settings').addEventListener('click', openSettings);
  wireModelSuggestionInputs();
  document.getElementById('btn-close-settings').addEventListener('click', closeSettings);
  document.getElementById('settings-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'settings-overlay') closeSettings();
  });
  wireSettingsTabs();

  wireRadioGroup('provider-chips', (chip) => {
    settings.provider = chip.dataset.provider;
    syncProviderFieldsVisibility();
  });
  ['anthropic', 'openai', 'gemini'].forEach(p => {
    const input = document.getElementById(p + '-baseurl-input');
    if (input) input.addEventListener('input', syncProxyHints);
  });
  wireRadioGroup('lang-rule-chips');
  wireRadioGroup('output-lang-chips', (chip) => {
    document.getElementById('output-lang-custom-input').style.display =
      chip.dataset.outlang === 'custom' ? 'block' : 'none';
  });
  wireRadioGroup('pagination-mode-chips', (chip) => {
    document.getElementById('paras-per-page-wrap').style.display =
      chip.dataset.mode === 'none' ? 'none' : 'block';
  });
  wireRadioGroup('theme-chips');
  document.getElementById('font-size-input').addEventListener('input', (e) => {
    document.getElementById('font-size-value').textContent = e.target.value + 'px';
  });

  document.getElementById('chapter-select').addEventListener('change', (e) => {
    switchChapter(parseInt(e.target.value, 10));
    syncSettingsFormFromState();
  });

  document.getElementById('btn-load-example').addEventListener('click', loadExampleText);
  document.getElementById('btn-restore-example').addEventListener('click', async () => {
    await loadExampleText();
    syncSettingsFormFromState();
  });
  // Deliberately does NOT read the title fields: they describe the document
  // that is currently open, and a new document must not inherit its titles.
  // Importing a 391-page PDF while the example book was open used to produce a
  // document whose only chapter was called "Einleitung" -- the same inheritance
  // bug applyNewChapters() already fixes for bookTitle. The fields are
  // repopulated from the new document by syncTitleFieldsFromState() right after,
  // so renaming it is still one keystroke away.
  document.getElementById('btn-apply-text-new').addEventListener('click', () => {
    applyTextAsNewDocument();
  });
  document.getElementById('btn-apply-text-update').addEventListener('click', () => {
    bookTitle = document.getElementById('book-title-field').value.trim() || bookTitle;
    chapterTitle = document.getElementById('chapter-title-field').value.trim() || chapterTitle;
    chapterDates = document.getElementById('chapter-dates-field').value.trim();
    applyTextToCurrentDocument();
  });

  document.getElementById('btn-clear-cache').addEventListener('click', async () => {
    await clearCurrentDocumentCache();
    setImportStatus(t('cache.cleared'), 'success');
    renderStorageUsage();
  });

  document.getElementById('btn-save-settings').addEventListener('click', () => {
    // Only settings that actually change how the text is split into
    // sentences or laid out into pages should reset/rebuild the reading
    // view -- e.g. just switching the AI provider/model used to also jump
    // the reader back to page 1 for no reason, because this handler always
    // called rebuildParagraphSentences()+renderPage(0) unconditionally.
    const prevSentenceLang = settings.sentenceLang;
    const prevPaginationMode = settings.paginationMode;
    const prevParasPerPage = settings.parasPerPage;
    const prevFontFamily = settings.fontFamily;
    const prevFontSize = settings.fontSize;

    const selectedProvider = document.querySelector('#provider-chips .radio-chip.selected');
    settings.provider = selectedProvider ? selectedProvider.dataset.provider : 'anthropic';

    settings.providers.anthropic.apiKey = document.getElementById('anthropic-key-input').value.trim();
    settings.providers.anthropic.model = document.getElementById('anthropic-model-input').value.trim() || PROVIDER_DEFAULTS.anthropic.model;
    settings.providers.anthropic.baseUrl = document.getElementById('anthropic-baseurl-input').value.trim();
    settings.providers.openai.apiKey = document.getElementById('openai-key-input').value.trim();
    settings.providers.openai.baseUrl = document.getElementById('openai-baseurl-input').value.trim() || PROVIDER_DEFAULTS.openai.baseUrl;
    settings.providers.openai.model = document.getElementById('openai-model-input').value.trim() || PROVIDER_DEFAULTS.openai.model;
    settings.providers.gemini.apiKey = document.getElementById('gemini-key-input').value.trim();
    settings.providers.gemini.baseUrl = document.getElementById('gemini-baseurl-input').value.trim() || PROVIDER_DEFAULTS.gemini.baseUrl;
    settings.providers.gemini.model = document.getElementById('gemini-model-input').value.trim() || PROVIDER_DEFAULTS.gemini.model;

    const selectedLang = document.querySelector('#lang-rule-chips .radio-chip.selected');
    settings.sentenceLang = selectedLang ? selectedLang.dataset.lang : 'de';

    const selectedOutLang = document.querySelector('#output-lang-chips .radio-chip.selected');
    settings.outputLang = selectedOutLang ? selectedOutLang.dataset.outlang : 'zh';
    settings.customOutputLang = document.getElementById('output-lang-custom-input').value.trim();

    const selectedMode = document.querySelector('#pagination-mode-chips .radio-chip.selected');
    settings.paginationMode = selectedMode ? selectedMode.dataset.mode : 'paragraphs';

    const perPage = parseInt(document.getElementById('paras-per-page-input').value, 10);
    settings.parasPerPage = (Number.isFinite(perPage) && perPage > 0) ? perPage : 8;

    const selectedTheme = document.querySelector('#theme-chips .radio-chip.selected');
    settings.theme = selectedTheme ? selectedTheme.dataset.theme : '';

    settings.fontFamily = document.getElementById('font-family-select').value;
    const fontSize = parseInt(document.getElementById('font-size-input').value, 10);
    settings.fontSize = Number.isFinite(fontSize) ? fontSize : 19;

    saveSettingsToLocalStorage();
    applyTheme(true);
    applyFont();

    const sentenceLangChanged = settings.sentenceLang !== prevSentenceLang;
    const layoutChanged = settings.paginationMode !== prevPaginationMode ||
      settings.parasPerPage !== prevParasPerPage ||
      settings.fontFamily !== prevFontFamily ||
      settings.fontSize !== prevFontSize;

    if (sentenceLangChanged) {
      // re-splitting into sentences invalidates sid-based state entirely --
      // page 0 is the only sane place to land
      rebuildParagraphSentences();
      renderPage(0);
    } else if (layoutChanged) {
      // pagination/font geometry changed but the sentences themselves
      // didn't -- recompute page boundaries and try to stay close to where
      // the reader was rather than snapping back to page 1
      recomputeTotalPages();
      renderPage(Math.min(currentPage, totalPages - 1));
    }
    // else: nothing that affects the reading view changed (provider, model,
    // API key, output language, theme, ...) -- leave the current page alone

    closeSettings();
  });

  wireFileImport();
}

// ============================================================
// Title fields wiring
// ============================================================
function wireTitleFields() {
  const bookEl = document.getElementById('book-title-field');
  const chapterEl = document.getElementById('chapter-title-field');
  const datesEl = document.getElementById('chapter-dates-field');

  syncTitleFieldsFromState();

  bookEl.addEventListener('change', () => {
    bookTitle = bookEl.value;
    saveTextToLocalStorage();
  });
  chapterEl.addEventListener('change', () => {
    chapterTitle = chapterEl.value;
    if (chapters[currentChapterIndex]) chapters[currentChapterIndex].title = chapterTitle;
    renderTocList();
    populateChapterSelect();
    saveTextToLocalStorage();
  });
  datesEl.addEventListener('change', () => {
    chapterDates = datesEl.value;
    if (chapters[currentChapterIndex]) chapters[currentChapterIndex].dateRange = chapterDates;
    renderTocList();
    populateChapterSelect();
    saveTextToLocalStorage();
  });

  // 'change' only fires on blur, so without this a title being typed would
  // run past the edge until the reader clicked away.
  [bookEl, chapterEl, datesEl].forEach(el => {
    el.addEventListener('input', () => fitTitleField(el));
  });

  const addDatesBtn = document.getElementById('btn-add-dates');
  if (addDatesBtn) {
    addDatesBtn.addEventListener('click', () => {
      datesEl.classList.remove('hidden');
      addDatesBtn.classList.add('hidden');
      fitTitleField(datesEl); // only measurable now that it isn't display:none
      datesEl.focus();
    });
  }
}

// Probes for the remote diagnostics channel (see debugLog). Installed only when
// `server.py --debug-log` served this page, so this costs nothing in normal use.
//
// The question they answer is deliberately narrow, because it is the one that
// cannot be answered by reasoning about the code: for a tap that "does nothing",
// which stage stopped -- did a touch land on the sentence, did the browser turn
// it into a click, did our handler run? The reported symptom "the sentence
// highlights but nothing happens" proves none of that: `.sent:active` and the
// mouseenter-driven `.hover` class paint the identical background without any
// handler running.
//
// elementFromPoint at the touch coordinates is logged too: if it comes back as
// something other than the sentence, an invisible element is covering it and the
// whole search moves to CSS.
function installDebugProbes() {
  if (!DEBUG_ENDPOINT && !DEBUG_OVERLAY) return;

  window.addEventListener('error', (e) => {
    debugLog('error', { msg: e.message, stack: (e.error && e.error.stack) || '' });
  });
  window.addEventListener('unhandledrejection', (e) => {
    const r = e.reason;
    debugLog('rejection', { msg: (r && r.message) || String(r), stack: (r && r.stack) || '' });
  });

  const sidAt = (target) => {
    const sent = target && target.closest && target.closest('.sent');
    return sent ? sent.dataset.sid : null;
  };

  document.addEventListener('touchstart', (e) => {
    const touch = e.touches[0];
    if (!touch) return;
    const hit = document.elementFromPoint(touch.clientX, touch.clientY);
    debugLog('touchstart', {
      sid: sidAt(e.target),
      x: Math.round(touch.clientX), y: Math.round(touch.clientY),
      // What the browser thinks is at that point, and what our own span is:
      // a mismatch means something is on top of the text.
      hit: hit ? hit.className + '#' + (hit.dataset ? hit.dataset.sid : '') : 'none',
      page: currentPage,
    });
  }, { capture: true, passive: true });

  document.addEventListener('click', (e) => {
    const sent = e.target && e.target.closest && e.target.closest('.sent');
    debugLog('click', {
      sid: sidAt(e.target), page: currentPage,
      // Was this node replaced after we wired it up? A DOM rewriter (browser
      // translation, an extension) that reassigns innerHTML produces spans
      // that look identical -- same class, same data-sid -- and carry no
      // listeners. Both markers below are set by us at build time and cannot
      // survive such a rewrite.
      wired: sent ? sent.__wired === true : null,
      dup: sent ? document.querySelectorAll('.sent[data-sid="' + sent.dataset.sid + '"]').length : 0,
      // Microsoft Translator stamps these on every element it rewrites, and
      // wraps translated runs in <font>. Either one appearing is the answer.
      mst: document.querySelectorAll('[_msttexthash]').length,
      font: document.getElementsByTagName('font').length,
    });
  }, true);

  debugLog('ready', {
    ua: navigator.userAgent, w: innerWidth, h: innerHeight,
    touchPoints: navigator.maxTouchPoints,
  });
}

// ============================================================
// App init
// ============================================================
document.getElementById('btn-close-panel').addEventListener('click', togglePanel);
document.getElementById('btn-toggle-panel').addEventListener('click', togglePanel);
wirePanelDrag();

(async function init() {
  loadSettingsFromLocalStorage();
  adoptProxyProviderIfNeeded();
  applyTheme();
  applyFont();
  populateUiLangChips();
  wireUiLangChips();
  applyI18n();

  await loadInitialDocument();

  wireSentenceDelegation();
  wireTitleFields();
  observeTitleFit();
  wireSettingsModal();
  wireSettingsFocusTrap();
  wirePagerControls();
  wireToc();
  wireKeyboardShortcuts();
  wireResizeRerender();
  populateChapterSelect();
  renderTocList();
  renderDocLibraryList();

  rebuildParagraphSentences();
  const savedPage = await loadProgress();
  renderPage(savedPage);

  // On a phone the text and the analysis cannot both be usable at once, so the
  // reader starts with the whole screen for reading; tapping a sentence opens
  // the panel, which onSentenceClick already does. Decided once at startup
  // rather than on resize -- collapsing the panel out from under someone who
  // merely rotated the device would be worse than starting on the wrong foot.
  if (window.matchMedia('(max-width: 520px)').matches && !panelEl.classList.contains('collapsed')) {
    togglePanel();
  }

  installDebugProbes();

  // Nothing to configure when the proxy serving this page holds the key, so
  // don't open settings to ask for one.
  if (!currentProviderSettings().apiKey && !proxyInfoFor(settings.provider)) {
    // gentle nudge, not blocking: open settings automatically only the very
    // first time (no settings saved yet at all)
    const neverConfigured = !localStorage.getItem(SETTINGS_KEY);
    if (neverConfigured) {
      setTimeout(openSettings, 400);
    }
  }
})();
</script>
</body>
</html>
