<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<!--
  pdf.js dropped its classic UMD/global build starting with recent releases
  (cdnjs only ships pdf.min.mjs now, an ES module) -- loaded as an inline
  module and assigned onto window.pdfjsLib so the rest of the app, which
  checks window.pdfjsLib, doesn't need to know the difference.
-->
<script type="module">
  import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.min.mjs";
  window.pdfjsLib = pdfjsLib;
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.worker.min.mjs";
</script>
<script>
"use strict";

// ============================================================
// Default example text: the full book (Elisabeth von Heyking, public
// domain, 1926), split into chapters.
// BOOK_CHAPTERS: [{ id, title, dateRange, paragraphs: string[] }, ...]
// ============================================================
const BOOK_CHAPTERS = __BOOK_CHAPTERS_PLACEHOLDER__;
const BOOK_TITLE = "Elisabeth von Heyking · Tagebücher aus vier Weltteilen";
const DEFAULT_CHAPTER_ID = 'chile_valparaiso';

// ============================================================
// Settings / state
// ============================================================
const SETTINGS_KEY = 'lingua-lector-settings-v1';
const PROGRESS_KEY_PREFIX = 'lingua-lector-progress-';
const TEXT_STORAGE_KEY = 'lingua-lector-current-text-v2';
const CACHE_STORAGE_PREFIX = 'lingua-lector-cache-';
const CHAPTER_INDEX_KEY_PREFIX = 'lingua-lector-chapter-idx-';

// Which chapter was last open, per document -- this is separate from
// progressKeyForCurrentText()'s per-chapter *page* number, and separate from
// saveCurrentDocumentContent()'s saved chapter *content*: neither of those
// remembers which chapter index was active, so without this a reload always
// snapped back to the document's default chapter regardless of where the
// reader actually was.
function saveCurrentChapterIndex() {
  try { localStorage.setItem(CHAPTER_INDEX_KEY_PREFIX + currentDocId, String(currentChapterIndex)); } catch (e) { /* ignore */ }
}

function loadSavedChapterIndex(docId, maxIndex) {
  try {
    const raw = localStorage.getItem(CHAPTER_INDEX_KEY_PREFIX + docId);
    const n = parseInt(raw, 10);
    if (Number.isFinite(n) && n >= 0 && n <= maxIndex) return n;
  } catch (e) { /* ignore */ }
  return null;
}

// Multi-provider support: each provider keeps its own key/model/base URL so
// switching providers doesn't clobber the others' settings.
const PROVIDER_DEFAULTS = {
  anthropic: { apiKey: '', model: 'claude-sonnet-5', baseUrl: '' },
  openai: { apiKey: '', model: 'gpt-5.6-luna', baseUrl: 'https://api.openai.com/v1' },
  // Gemini default is a Flash-Lite tier because those models have a free quota
  // on the Gemini API -- important for a BYO-key tool aimed at casual readers.
  gemini: { apiKey: '', model: 'gemini-3.5-flash-lite', baseUrl: 'https://generativelanguage.googleapis.com/v1beta' },
};

const DEFAULT_SETTINGS = {
  provider: 'anthropic', // 'anthropic' | 'openai' | 'gemini'
  providers: {
    anthropic: { ...PROVIDER_DEFAULTS.anthropic },
    openai: { ...PROVIDER_DEFAULTS.openai },
    gemini: { ...PROVIDER_DEFAULTS.gemini },
  },
  sentenceLang: 'de',
  outputLang: 'zh',
  customOutputLang: '',
  paginationMode: 'paragraphs', // 'paragraphs' | 'none'
  parasPerPage: 8,
  theme: '', // '' = follow system, or 'light' | 'dark' | 'sepia'
  fontFamily: 'serif', // 'serif' | 'sans' | 'mono'
  fontSize: 19,
  uiLang: '', // '' = auto-detect from navigator.language, else a UI_LANGS code
};

function currentProviderSettings() {
  return settings.providers[settings.provider] || PROVIDER_DEFAULTS.anthropic;
}

let settings = { ...DEFAULT_SETTINGS };

// ============================================================
// Document library: multiple documents (the built-in book, plus any
// pasted/imported ones) can be kept in localStorage at once, each with its
// own chapters, reading progress, and AI-analysis cache -- switching between
// them doesn't re-parse or evict anything.
// ============================================================
const DOC_INDEX_KEY = 'lingua-lector-doc-index-v1';
const DOC_STORAGE_PREFIX = 'lingua-lector-doc-';
const CURRENT_DOC_POINTER_KEY = 'lingua-lector-current-doc-v1';
const BOOK_DOC_ID = 'book:heyking';
// Placeholder id for "no document at all" (the reader deleted everything,
// including the built-in example). Never written to the library index or the
// current-document pointer -- it only exists to give the reading view an empty
// chapter to render its "import something" state from.
const EMPTY_DOC_ID = 'doc:empty';
// The built-in example is a constant baked into the build, not a stored
// document, so "deleted" can only be remembered as a flag -- without it the
// first-launch path would put the book back on the very next reload.
const EXAMPLE_REMOVED_KEY = 'lingua-lector-example-removed-v1';

let currentDocId = BOOK_DOC_ID;

function isExampleRemoved() {
  try { return localStorage.getItem(EXAMPLE_REMOVED_KEY) === '1'; } catch (e) { return false; }
}

function setExampleRemoved(removed) {
  try {
    if (removed) localStorage.setItem(EXAMPLE_REMOVED_KEY, '1');
    else localStorage.removeItem(EXAMPLE_REMOVED_KEY);
  } catch (e) { /* ignore */ }
}

function docStorageKey(id) {
  return DOC_STORAGE_PREFIX + id;
}

function generateDocId() {
  return 'doc-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
}

function loadDocIndex() {
  try {
    const raw = localStorage.getItem(DOC_INDEX_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) { return []; }
}

function saveDocIndex(index) {
  try { localStorage.setItem(DOC_INDEX_KEY, JSON.stringify(index)); } catch (e) { /* ignore */ }
}

function upsertDocIndexEntry(entry) {
  const index = loadDocIndex();
  const i = index.findIndex(d => d.id === entry.id);
  if (i >= 0) index[i] = { ...index[i], ...entry };
  else index.push(entry);
  saveDocIndex(index);
}

// ============================================================
// Blob storage: document text and analysis caches.
//
// Everything else this app persists is tiny -- settings, a pointer, a page
// number -- and localStorage is the right home for it. These two are not: a
// 400-page import is over a megabyte of text, and localStorage is capped at
// about 5 MB per origin (measured on file:// in Chromium: it starts throwing
// at 4.96 MB). Importing the Satow diaries, 1.07M characters, into a library
// that already held one book therefore threw QuotaExceededError inside
// saveCurrentDocumentContent() -- where it was caught and ignored, so the
// document appeared in the library with its text silently missing and the
// reader was left looking at the previous book wondering what had happened.
//
// IndexedDB has no such cap (navigator.storage reports a ~10 GB quota on the
// same machine) and, importantly for a file that is meant to be opened by
// double-clicking it, works on file:// too -- verified in Chromium rather
// than assumed, because it is widely believed not to.
//
// It is asynchronous, and it is not always available: Firefox in private mode
// throws from open(), and a blocked or hung open() fires NO event at all --
// not even onerror. That last case is why the probe below times out instead
// of waiting for an answer that may never come. When IndexedDB can't be had,
// everything falls back to localStorage and behaves exactly as it did before,
// except that a quota failure is now reported to the reader rather than
// swallowed.
// ============================================================
const BLOB_DB_NAME = 'lingua-lector';
const BLOB_DB_STORE = 'blobs';
const BLOB_OPEN_TIMEOUT_MS = 2500;
// Keys that live in blob storage. DOC_INDEX_KEY is deliberately NOT one of
// them even though it starts with DOC_STORAGE_PREFIX: the index has to stay
// synchronously readable, and it is small.
function isBlobKey(key) {
  if (key === DOC_INDEX_KEY) return false;
  return key.indexOf(DOC_STORAGE_PREFIX) === 0 || key.indexOf(CACHE_STORAGE_PREFIX) === 0;
}

// Resolves to an IDBDatabase, or to null if IndexedDB is unavailable, refuses
// to open, or simply never answers. `factory` is passed in rather than read
// from the global so the timeout path is testable.
function openIdbWithTimeout(factory, timeoutMs) {
  return new Promise(resolve => {
    if (!factory) { resolve(null); return; }
    let settled = false;
    let timer = null;
    const done = (db) => {
      if (settled) return;
      settled = true;
      if (timer !== null) clearTimeout(timer);
      resolve(db);
    };
    timer = setTimeout(() => done(null), timeoutMs);
    try {
      const req = factory.open(BLOB_DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(BLOB_DB_STORE)) db.createObjectStore(BLOB_DB_STORE);
      };
      req.onsuccess = () => done(req.result);
      req.onerror = () => done(null);
      req.onblocked = () => done(null);
    } catch (e) {
      done(null);
    }
  });
}

const localStorageBlobBackend = {
  name: 'localStorage',
  // Deliberately no try/catch on set(): a failed write is exactly the thing
  // that used to disappear here, and the caller needs to see it.
  get: (key) => Promise.resolve(localStorage.getItem(key)),
  set: (key, value) => { localStorage.setItem(key, value); return Promise.resolve(); },
  remove: (key) => { localStorage.removeItem(key); return Promise.resolve(); },
  keys: (prefix) => {
    const out = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(prefix) === 0 && isBlobKey(k)) out.push(k);
    }
    return Promise.resolve(out);
  },
};

function idbBlobBackend(db) {
  // Resolve on transaction *complete*, not on request success: a write whose
  // request succeeded but whose transaction then aborted (quota) must reject.
  function tx(mode, fn) {
    return new Promise((resolve, reject) => {
      let t;
      try { t = db.transaction(BLOB_DB_STORE, mode); }
      catch (e) { reject(e); return; }
      let result;
      const req = fn(t.objectStore(BLOB_DB_STORE));
      if (req) req.onsuccess = () => { result = req.result; };
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error || new Error('IndexedDB transaction failed'));
      t.onabort = () => reject(t.error || new Error('IndexedDB transaction aborted'));
    });
  }
  return {
    name: 'indexedDB',
    get: (key) => tx('readonly', s => s.get(key)).then(v => (v === undefined ? null : v)),
    set: (key, value) => tx('readwrite', s => s.put(value, key)).then(() => undefined),
    remove: (key) => tx('readwrite', s => s.delete(key)).then(() => undefined),
    keys: (prefix) => tx('readonly', s => s.getAllKeys())
      .then(ks => (ks || []).filter(k => typeof k === 'string' && k.indexOf(prefix) === 0)),
  };
}

let blobBackend = localStorageBlobBackend;
let blobStoreReady = null;

// Moves anything already sitting in localStorage under the blob prefixes into
// IndexedDB, then deletes the localStorage copy -- which is the point: a
// library built up before this change is what is filling those 5 MB.
// A key that fails to copy keeps its localStorage original.
async function migrateBlobsToIdb(backend) {
  let keys = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && isBlobKey(k)) keys.push(k);
    }
  } catch (e) { return; }
  for (const key of keys) {
    try {
      const value = localStorage.getItem(key);
      if (value === null) continue;
      await backend.set(key, value);
      localStorage.removeItem(key);
    } catch (e) { /* leave this one where it is */ }
  }
}

function initBlobStore() {
  if (blobStoreReady) return blobStoreReady;
  blobStoreReady = (async () => {
    const factory = (typeof indexedDB !== 'undefined' && indexedDB) ? indexedDB : null;
    const db = await openIdbWithTimeout(factory, BLOB_OPEN_TIMEOUT_MS);
    if (!db) return blobBackend; // localStorage, as before
    blobBackend = idbBlobBackend(db);
    await migrateBlobsToIdb(blobBackend);
    return blobBackend;
  })();
  return blobStoreReady;
}

function blobGet(key) { return initBlobStore().then(b => b.get(key)); }
function blobSet(key, value) { return initBlobStore().then(b => b.set(key, value)); }
function blobRemove(key) { return initBlobStore().then(b => b.remove(key)); }
function blobKeys(prefix) { return initBlobStore().then(b => b.keys(prefix)); }

// Total bytes held in blob storage, plus what backend is actually in use --
// the "how much room is left" question localStorage gives no way to answer.
// Sizes are UTF-16 code units, which is how browsers charge for localStorage.
async function blobUsage() {
  const backend = await initBlobStore();
  let bytes = 0;
  for (const prefix of [DOC_STORAGE_PREFIX, CACHE_STORAGE_PREFIX]) {
    let keys = [];
    try { keys = await backend.keys(prefix); } catch (e) { continue; }
    for (const k of keys) {
      try {
        const v = await backend.get(k);
        if (typeof v === 'string') bytes += v.length * 2;
      } catch (e) { /* skip */ }
    }
  }
  return { backend: backend.name, bytes, limit: backend.name === 'localStorage' ? 5 * 1024 * 1024 : null };
}

async function documentStoredSize(id) {
  try {
    const raw = await blobGet(docStorageKey(id));
    return typeof raw === 'string' ? raw.length * 2 : 0;
  } catch (e) { return 0; }
}

function formatBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

function isQuotaError(err) {
  if (!err) return false;
  return err.name === 'QuotaExceededError' ||
    err.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
    /quota/i.test(err.message || '');
}

// A storage write that fails has to be visible. This is the whole reason the
// Satow import looked like a no-op: the throw was caught and dropped, the
// reader got a success message, and the text was gone.
function reportStorageError(err) {
  console.error(err);
  const msg = isQuotaError(err)
    ? t('storage.full', { backend: blobBackend.name })
    : t('storage.writeFailed', { msg: (err && err.message) || String(err) });
  try { setImportStatus(msg, 'error'); } catch (e) { /* settings panel not built yet */ }
}

async function loadDocumentContent(id) {
  try {
    const raw = await blobGet(docStorageKey(id));
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

// The currently loaded work: either the built-in book's chapters, or a
// single synthetic chapter holding pasted/imported custom text.
let bookTitle = BOOK_TITLE;
let chapters = [];
let currentChapterIndex = 0;

function currentChapter() {
  return chapters[currentChapterIndex] || { id: 'custom', title: '', dateRange: '', paragraphs: [] };
}

// PARAGRAPHS always mirrors chapters[currentChapterIndex].paragraphs; kept as
// a separate binding because the rest of the app reads/writes it directly.
let PARAGRAPHS = [];
let chapterTitle = "";
let chapterDates = "";

function syncFromCurrentChapter() {
  const ch = currentChapter();
  PARAGRAPHS = ch.paragraphs;
  chapterTitle = ch.title;
  chapterDates = ch.dateRange;
}

function loadDefaultBook() {
  chapters = BOOK_CHAPTERS.map(c => ({ ...c, paragraphs: c.paragraphs.slice() }));
  bookTitle = BOOK_TITLE;
  currentChapterIndex = Math.max(0, chapters.findIndex(c => c.id === DEFAULT_CHAPTER_ID));
  syncFromCurrentChapter();
}

function loadSettingsFromLocalStorage() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      settings = { ...DEFAULT_SETTINGS, ...parsed };
      // deep-merge providers so a saved settings blob missing a provider
      // (e.g. saved before openai/gemini existed) still gets sane defaults
      settings.providers = {
        anthropic: { ...PROVIDER_DEFAULTS.anthropic, ...(parsed.providers && parsed.providers.anthropic) },
        openai: { ...PROVIDER_DEFAULTS.openai, ...(parsed.providers && parsed.providers.openai) },
        gemini: { ...PROVIDER_DEFAULTS.gemini, ...(parsed.providers && parsed.providers.gemini) },
      };
      // migrate pre-multi-provider settings (flat apiKey/model, Anthropic-only)
      if (parsed.apiKey && !settings.providers.anthropic.apiKey) {
        settings.providers.anthropic.apiKey = parsed.apiKey;
      }
      if (parsed.model && !parsed.providers) {
        settings.providers.anthropic.model = parsed.model;
      }
    }
  } catch (e) { /* ignore corrupt storage */ }
}

function saveSettingsToLocalStorage() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  } catch (e) { /* storage may be unavailable (private browsing, quota) */ }
}

// Resolves true when the document's text is actually on disk. The index entry
// is written only after that succeeds: a library row pointing at text that was
// never stored is worse than no row at all -- opening it later finds nothing
// and silently leaves the previous document on screen.
async function saveCurrentDocumentContent() {
  if (currentDocId === EMPTY_DOC_ID) return true; // placeholder: nothing to persist
  try {
    await blobSet(docStorageKey(currentDocId), JSON.stringify({ bookTitle, chapters }));
  } catch (e) {
    reportStorageError(e);
    return false;
  }
  upsertDocIndexEntry({
    id: currentDocId,
    title: bookTitle,
    chapterCount: chapters.length,
    savedAt: Date.now(),
    builtin: currentDocId === BOOK_DOC_ID,
  });
  try { localStorage.setItem(CURRENT_DOC_POINTER_KEY, currentDocId); } catch (e) { /* ignore */ }
  return true;
}

// kept as an alias: existing call sites (title-field edits, chapter renames)
// just want "persist whatever changed about the current document"
function saveTextToLocalStorage() {
  return saveCurrentDocumentContent();
}

async function loadTextFromLocalStorage() {
  try {
    const pointer = localStorage.getItem(CURRENT_DOC_POINTER_KEY);
    if (pointer) {
      if (pointer === BOOK_DOC_ID && !isExampleRemoved()) {
        loadDefaultBook();
        currentDocId = BOOK_DOC_ID;
        const savedIdx = loadSavedChapterIndex(BOOK_DOC_ID, chapters.length - 1);
        if (savedIdx !== null) { currentChapterIndex = savedIdx; syncFromCurrentChapter(); }
        return true;
      }
      const content = await loadDocumentContent(pointer);
      if (content && Array.isArray(content.chapters) && content.chapters.length) {
        chapters = content.chapters;
        bookTitle = content.bookTitle || bookTitle;
        currentDocId = pointer;
        currentChapterIndex = loadSavedChapterIndex(pointer, chapters.length - 1) || 0;
        syncFromCurrentChapter();
        return true;
      }
    }

    // migrate from v2 (single "current text" blob, pre-document-library)
    const v2Raw = localStorage.getItem(TEXT_STORAGE_KEY);
    if (v2Raw) {
      const parsed = JSON.parse(v2Raw);
      if (Array.isArray(parsed.chapters) && parsed.chapters.length) {
        const looksLikeBook = parsed.chapters.length === BOOK_CHAPTERS.length &&
          parsed.chapters.every((c, i) => c.id === BOOK_CHAPTERS[i].id);
        if (looksLikeBook) {
          loadDefaultBook();
          currentDocId = BOOK_DOC_ID;
        } else {
          chapters = parsed.chapters;
          bookTitle = parsed.bookTitle || bookTitle;
          currentDocId = generateDocId();
          currentChapterIndex = 0;
          syncFromCurrentChapter();
        }
        await saveCurrentDocumentContent();
        localStorage.removeItem(TEXT_STORAGE_KEY);
        return true;
      }
    }

    // migrate from v1 (older single flat-array) format, if present
    const legacyRaw = localStorage.getItem('lingua-lector-current-text-v1');
    if (legacyRaw) {
      const legacy = JSON.parse(legacyRaw);
      if (Array.isArray(legacy.paragraphs) && legacy.paragraphs.length) {
        // v1 only ever held a single chapter (the old Chile-only default, or
        // a user's pasted/imported text). If it's byte-for-byte the old
        // shipped default, it's not real user customization — load the full
        // multi-chapter book instead of silently downgrading to one chapter.
        const defaultChile = BOOK_CHAPTERS.find(c => c.id === 'chile_valparaiso');
        const looksLikeOldDefault = defaultChile &&
          JSON.stringify(legacy.paragraphs) === JSON.stringify(defaultChile.paragraphs);

        localStorage.removeItem('lingua-lector-current-text-v1');
        if (looksLikeOldDefault) {
          return false; // fall through to loadDefaultBook() in init()
        }

        chapters = [{
          id: 'custom',
          title: legacy.chapterTitle || '',
          dateRange: legacy.chapterDates || '',
          paragraphs: legacy.paragraphs,
        }];
        bookTitle = legacy.bookTitle || bookTitle;
        currentDocId = generateDocId();
        currentChapterIndex = 0;
        syncFromCurrentChapter();
        await saveCurrentDocumentContent();
        return true;
      }
    }
  } catch (e) { /* ignore corrupt storage */ }
  return false;
}

// What init() loads: last-open document if there is one, otherwise the first
// document still available. Falling straight back to the built-in example here
// would resurrect it right after the reader deleted it, which is why this goes
// through availableDocumentIds() instead of calling loadDefaultBook() blindly.
async function loadInitialDocument() {
  if (await loadTextFromLocalStorage()) return;
  const next = availableDocumentIds()[0];
  if (next === BOOK_DOC_ID) {
    loadDefaultBook();
    currentDocId = BOOK_DOC_ID;
    return;
  }
  const content = next ? await loadDocumentContent(next) : null;
  if (content && Array.isArray(content.chapters) && content.chapters.length) {
    chapters = content.chapters;
    bookTitle = content.bookTitle || bookTitle;
    currentDocId = next;
    currentChapterIndex = loadSavedChapterIndex(next, chapters.length - 1) || 0;
    syncFromCurrentChapter();
    return;
  }
  loadEmptyDocument();
}

// Switches the active document. Each document's chapters, reading progress,
// and analysis cache are independent -- switching never re-parses or evicts
// another document's data.
async function switchToDocument(id) {
  if (id === currentDocId) return;
  if (id === BOOK_DOC_ID) {
    loadDefaultBook();
    currentDocId = BOOK_DOC_ID;
    const savedIdx = loadSavedChapterIndex(BOOK_DOC_ID, chapters.length - 1);
    if (savedIdx !== null) { currentChapterIndex = savedIdx; syncFromCurrentChapter(); }
  } else {
    const content = await loadDocumentContent(id);
    if (!content) return;
    chapters = content.chapters;
    bookTitle = content.bookTitle || BOOK_TITLE;
    currentDocId = id;
    currentChapterIndex = loadSavedChapterIndex(id, chapters.length - 1) || 0;
    syncFromCurrentChapter();
  }
  await saveCurrentDocumentContent();
  rebuildParagraphSentences();
  renderPage(0);
  renderTocList();
  populateChapterSelect();
  renderDocLibraryList();
  syncTitleFieldsFromState();
}

// Documents that can be opened right now: everything in the stored index, plus
// the built-in example unless the reader deleted it.
function availableDocumentIds() {
  const stored = loadDocIndex().map(d => d.id).filter(id => id !== BOOK_DOC_ID);
  return (isExampleRemoved() ? [] : [BOOK_DOC_ID]).concat(stored);
}

// Nothing loaded at all -- every document, including the built-in example, has
// been deleted. Renders the reader's "import something" empty state.
function loadEmptyDocument() {
  chapters = [{ id: 'empty', title: '', dateRange: '', paragraphs: [] }];
  bookTitle = '';
  currentDocId = EMPTY_DOC_ID;
  currentChapterIndex = 0;
  syncFromCurrentChapter();
  try { localStorage.removeItem(CURRENT_DOC_POINTER_KEY); } catch (e) { /* ignore */ }
}

// Deleting the built-in example is allowed (it can always be brought back from
// the document tab, since its text is embedded in the build itself); what gets
// removed is only the library entry, its cache and its reading position.
async function deleteDocumentFromLibrary(id) {
  try { await blobRemove(docStorageKey(id)); } catch (e) { /* ignore */ }
  try { localStorage.removeItem(CHAPTER_INDEX_KEY_PREFIX + id); } catch (e) { /* ignore */ }
  await clearDocumentCache(id);
  saveDocIndex(loadDocIndex().filter(d => d.id !== id));
  if (id === BOOK_DOC_ID) setExampleRemoved(true);

  if (currentDocId === id) {
    const next = availableDocumentIds()[0];
    if (next) {
      await switchToDocument(next);
    } else {
      loadEmptyDocument();
      rebuildParagraphSentences();
      renderPage(0);
      renderTocList();
      populateChapterSelect();
      renderDocLibraryList();
      syncTitleFieldsFromState();
    }
  } else {
    renderDocLibraryList();
  }
}

// storage key for reading-progress persistence, derived from the current text
// so different loaded texts don't clobber each other's saved page
function progressKeyForCurrentText() {
  // cheap hash of the first ~200 chars of paragraph 0, plus paragraph count
  const sample = (PARAGRAPHS[0] || '').slice(0, 200) + '|' + PARAGRAPHS.length;
  let hash = 0;
  for (let i = 0; i < sample.length; i++) {
    hash = ((hash << 5) - hash + sample.charCodeAt(i)) | 0;
  }
  return PROGRESS_KEY_PREFIX + hash;
}

// ============================================================
// Sentence splitter (language-parameterized)
//
// Produces two parallel views of a paragraph:
//
//   segments -- what gets RENDERED, in reading order. They tile the paragraph
//               exactly: concatenating every segment's text reproduces the
//               input character for character.
//   units    -- what gets ANALYSED. A unit is one clickable sentence and may
//               own SEVERAL, NON-ADJACENT segments.
//
// The two differ because of footnotes. In
//
//     A [Fußnote: F1. F2.] B.
//
// the footnote interrupts the sentence "A B." A reader clicking the main text
// wants that sentence *without* the footnote, while the footnote's own
// sentences should still be clickable in their own right. So:
//
//   segments: "A "  "[Fußnote: F1. "  "F2.]"  " B."
//   uid:       0     1                 2       0
//   units:     0 -> "A B."   1 -> "Fußnote: F1."   2 -> "F2."
//
// A bracket counts as a footnote only when its contents contain at least one
// complete sentence. Short glosses ("[Gartenvorstadt]", "[deutscher
// Ministerresident in Chile]") have no sentence-ending punctuation, so they
// stay inline as part of the sentence carrying them -- which is what a reader
// expects, since they are grammatically part of it.
//
// Handles besides that: abbreviations from the selected table, literal "..."
// and "…" ellipses, repeated "!!"/"??", guillemets and other quote marks,
// numeric ordinals ("15." as a date).
// ============================================================

// Trailing sentence-ending punctuation, allowing closing quotes/brackets after it.
const SENTENCE_END_RE = /[.!?…][»«"“”‹›'’)\]]*\s*$/;

// Core scanner. Takes an array of code points and returns index ranges that
// TILE it exactly -- every character lands in exactly one range, in order.
// Working in ranges rather than strings is what lets the layer above map one
// sentence onto several disjoint stretches of the original paragraph.
function scanSentenceRanges(chars, ABBREV) {
  const ranges = [];
  let i = 0;
  let tokenStart = 0;

  const cur = () => chars.slice(tokenStart, i).join('');

  function closeToken() {
    // absorb the spaces separating this sentence from the next so the ranges
    // leave no gaps
    let e = i;
    while (e < chars.length && chars[e] === ' ') e++;
    if (e > tokenStart) ranges.push({ start: tokenStart, end: e });
    tokenStart = e;
    i = e;
  }

  while (i < chars.length) {
    const c = chars[i];

    // Any bracket reaching the scanner is an inline gloss -- footnotes were
    // lifted out before this ran. Punctuation inside a gloss belongs to the
    // gloss, so consume the whole balanced span without considering a split.
    if (c === '[') {
      let d = 0;
      while (i < chars.length) {
        if (chars[i] === '[') d++;
        else if (chars[i] === ']') d--;
        i++;
        if (d === 0) break;
      }
      continue;
    }

    // Ellipsis, in either spelling: the literal three-or-more dots or the
    // single U+2026 glyph. Both behave identically -- an ellipsis ends a
    // sentence only when what follows actually starts one.
    if ((c === '.' && chars[i + 1] === '.' && chars[i + 2] === '.') || c === '…') {
      if (c === '…') i++;
      else while (chars[i] === '.') i++;
      let j = i;
      while (j < chars.length && chars[j] === ' ') j++;
      if (/[A-ZÀ-ÖØ-Þ]/.test(chars[j] || '')) closeToken();
      continue;
    }

    if (c === '.' || c === '!' || c === '?') {
      const trimmed = cur().replace(/[»«"“”‹›'’]+$/, '');
      const wordMatch = trimmed.match(/([A-Za-zÀ-ÖØ-öø-ÿ]+)\.?$/);
      let isAbbrev = false;

      // numeric ordinal like "15." or "5." (dates, list numbers) -> not an end
      if (c === '.' && /(\d+)\s*$/.test(trimmed)) isAbbrev = true;

      if (!isAbbrev && wordMatch) {
        const w = wordMatch[1].toLowerCase();
        if (ABBREV.has(w)) isAbbrev = true;
        if (wordMatch[1].length === 1) isAbbrev = true; // initials: "T.", "G.", "z."...
      }

      let j = i + 1;
      while (j < chars.length && chars[j] === ' ') j++;
      // look past a closing bracket and any closing quote before judging what
      // follows: in »...gebt uns zu essen!«, was sich... it is the comma, not
      // the guillemet, that settles whether the sentence really ended
      while (chars[j] === ']') {
        j++;
        while (j < chars.length && chars[j] === ' ') j++;
      }
      while (j < chars.length && /[»«"“”‹›'’)]/.test(chars[j])) {
        j++;
        while (j < chars.length && chars[j] === ' ') j++;
      }
      const nextChar = chars[j] || '';
      const nextIsLower = /[a-zà-öø-ÿ]/.test(nextChar);
      const nextContinuesClause = /[,;:]/.test(nextChar); // clause carries on

      if ((c === '.' && isAbbrev) || nextIsLower || nextContinuesClause) {
        i++;
        continue;
      }

      i++;
      while (i < chars.length && /[.!?]/.test(chars[i])) i++;
      // a closing quote or bracket right after the punctuation belongs to this
      // sentence, not the next one
      while (i < chars.length && /[»«"“”‹›'’)\]]/.test(chars[i])) i++;
      closeToken();
      continue;
    }

    i++;
  }
  if (chars.length > tokenStart) ranges.push({ start: tokenStart, end: chars.length });

  // Merge stray tiny non-alphanumeric fragments (a lone trailing dash, say)
  // into the previous sentence rather than showing them as their own unit.
  const merged = [];
  for (const r of ranges) {
    const text = chars.slice(r.start, r.end).join('').trim();
    const isTinyFragment = text.length <= 2 && !/[A-Za-zÀ-ÖØ-öø-ÿ0-9]/.test(text);
    if (isTinyFragment && merged.length) merged[merged.length - 1].end = r.end;
    else merged.push({ start: r.start, end: r.end });
  }
  return merged;
}

// Top-level balanced [...] spans as {start, end} over `chars` (end exclusive,
// brackets included). Unbalanced brackets are ignored and stay literal text.
function topLevelBracketSpans(chars) {
  const spans = [];
  let depth = 0;
  let openedAt = -1;
  for (let k = 0; k < chars.length; k++) {
    if (chars[k] === '[') {
      if (depth === 0) openedAt = k;
      depth++;
    } else if (chars[k] === ']' && depth > 0) {
      depth--;
      if (depth === 0 && openedAt >= 0) {
        spans.push({ start: openedAt, end: k + 1 });
        openedAt = -1;
      }
    }
  }
  return spans;
}

function splitIntoSentenceUnits(paragraph, langCode) {
  const ABBREV = buildAbbrevSet(langCode || settings.sentenceLang);
  const chars = Array.from(paragraph);

  // 1. Which bracket spans are footnotes (contain a complete sentence) rather
  //    than inline glosses?
  // The test is that the contents END with sentence-ending punctuation, which
  // is a stricter reading of "contains a complete sentence" -- and a
  // deliberately more robust one. Testing whether ANY sentence inside looks
  // complete makes the decision hostage to the abbreviation table: an
  // unlisted abbreviation mid-gloss reads as a sentence end and the gloss gets
  // torn out of its sentence. "[wo sie wohnten, als Heyking 1885 stellvertr.
  // Generalkonsul in New York war]" is a relative clause, not a footnote, but
  // "stellvertr." made it look like one. Requiring the closing punctuation
  // removes that whole failure class structurally rather than by chasing
  // abbreviations across twelve languages, and the two failure modes are not
  // symmetric: wrongly keeping a footnote inline is untidy, wrongly lifting a
  // gloss silently mutilates the sentence a reader is trying to study.
  const footnotes = topLevelBracketSpans(chars).filter(sp =>
    SENTENCE_END_RE.test(chars.slice(sp.start + 1, sp.end - 1).join('')));

  const isFootnoteChar = new Array(chars.length).fill(false);
  footnotes.forEach(sp => {
    for (let k = sp.start; k < sp.end; k++) isFootnoteChar[k] = true;
  });

  const units = [];
  const segments = [];
  const addUnit = (kind) => {
    const u = { uid: units.length, text: '', kind };
    units.push(u);
    return u;
  };

  // 2. The main text is the paragraph with footnotes lifted out. Scanning it
  //    in its own coordinate space and mapping the ranges back gives each main
  //    sentence the (possibly disjoint) stretches it really occupies.
  const mainIdx = [];
  for (let k = 0; k < chars.length; k++) if (!isFootnoteChar[k]) mainIdx.push(k);
  const mainChars = mainIdx.map(k => chars[k]);

  for (const r of scanSentenceRanges(mainChars, ABBREV)) {
    const unit = addUnit('main');
    // group this sentence's original indices into contiguous runs; each run
    // becomes one rendered segment
    let runStart = null;
    let prev = null;
    const emit = (a, b) => segments.push({ uid: unit.uid, start: a, end: b + 1 });
    for (let m = r.start; m < r.end; m++) {
      const o = mainIdx[m];
      if (runStart === null) { runStart = o; prev = o; continue; }
      if (o === prev + 1) { prev = o; continue; }
      emit(runStart, prev);
      runStart = o; prev = o;
    }
    if (runStart !== null) emit(runStart, prev);
  }

  // 3. Each footnote's interior is split normally and its sentences become
  //    units of their own. The brackets are rendered with the first and last of
  //    those sentences so the paragraph still reads as written, but they are
  //    left out of the analysed text.
  for (const sp of footnotes) {
    const inner = chars.slice(sp.start + 1, sp.end - 1);
    const innerRanges = scanSentenceRanges(inner, ABBREV);
    if (!innerRanges.length) {
      const unit = addUnit('footnote');
      segments.push({ uid: unit.uid, start: sp.start, end: sp.end });
      continue;
    }
    innerRanges.forEach((r, n) => {
      const unit = addUnit('footnote');
      const first = n === 0;
      const last = n === innerRanges.length - 1;
      segments.push({
        uid: unit.uid,
        start: first ? sp.start : sp.start + 1 + r.start,
        end: last ? sp.end : sp.start + 1 + r.end,
      });
    });
  }

  // 4. Reading order, then each unit's analysis text.
  segments.sort((a, b) => a.start - b.start);
  segments.forEach(seg => { seg.text = chars.slice(seg.start, seg.end).join(''); });

  const parts = new Map();
  segments.forEach(seg => {
    if (!parts.has(seg.uid)) parts.set(seg.uid, []);
    parts.get(seg.uid).push(seg.text);
  });
  units.forEach(u => {
    let text = (parts.get(u.uid) || []).join(' ');
    // a footnote unit carries the brackets for rendering but is analysed without them
    if (u.kind === 'footnote') text = text.replace(/^\[/, '').replace(/\]$/, '');
    u.text = text.replace(/\s+/g, ' ').trim();
  });

  // A unit whose segments were pure whitespace has nothing to analyse; drop it
  // and give its segments to the previous surviving unit so the text still tiles.
  const kept = [];
  const remap = new Map();
  for (const u of units) {
    if (u.text) { remap.set(u.uid, u.uid); kept.push(u); }
    else if (kept.length) remap.set(u.uid, kept[kept.length - 1].uid);
    else remap.set(u.uid, null);
  }
  const outSegments = [];
  for (const seg of segments) {
    const uid = remap.get(seg.uid);
    if (uid === null || uid === undefined) {
      // leading whitespace with no owner yet -- hand it to whatever comes first
      outSegments.push({ uid: null, text: seg.text });
      continue;
    }
    const last = outSegments[outSegments.length - 1];
    if (last && last.uid === uid) last.text += seg.text; // re-merge adjacent runs
    else outSegments.push({ uid, text: seg.text });
  }
  for (const seg of outSegments) {
    if (seg.uid !== null) continue;
    const owner = outSegments.find(s => s.uid !== null);
    if (owner) { owner.text = seg.text + owner.text; seg.text = ''; }
  }

  // Fold whitespace-only segments into a neighbour. They arise at the edges of
  // a paragraph and in the gap a lifted-out footnote leaves behind. Keeping
  // them would put an invisible clickable sliver between two sentences, and
  // since whitespace has nothing to analyse it does not matter which unit ends
  // up owning it -- only that the text still tiles.
  const final = [];
  for (const seg of outSegments) {
    if (!seg.text) continue;
    if (!seg.text.trim() && final.length) {
      final[final.length - 1].text += seg.text;
      continue;
    }
    final.push(seg);
  }
  while (final.length > 1 && !final[0].text.trim()) {
    final[1].text = final[0].text + final[1].text;
    final.shift();
  }

  // A paragraph with no analysable text at all (pure whitespace) yields
  // nothing to render and nothing to click -- units and segments are both
  // empty, and there is no sentence for the stray whitespace to belong to.
  if (!kept.length) return { units: [], segments: [] };
  return { units: kept, segments: final.filter(s => s.uid !== null) };
}

// Thin wrapper: just the analysable sentence texts, for callers that do not
// care where those sentences physically sit in the paragraph.
function splitIntoSentences(paragraph, langCode) {
  return splitIntoSentenceUnits(paragraph, langCode).units.map(u => u.text);
}

function resolveUiLang() {
  if (settings.uiLang && UI_LANGS.includes(settings.uiLang)) return settings.uiLang;
  try {
    const nav = (navigator.language || 'zh').toLowerCase();
    if (nav.startsWith('zh-hant') || nav.startsWith('zh-tw') || nav.startsWith('zh-hk')) return 'zh-hant';
    const base = nav.split('-')[0];
    if (UI_LANGS.includes(base)) return base;
  } catch (e) { /* navigator unavailable */ }
  return 'zh';
}

function t(key, vars) {
  const lang = resolveUiLang();
  const dict = I18N[lang] || I18N.zh;
  // NOTE: must use hasOwnProperty, not `||`. Several keys legitimately translate
  // to the empty string (e.g. 'toolbar.pagerSuffix' is '' in en/de/fr/es/it/ru
  // because those languages put the whole label in the prefix). A falsy check
  // here silently fell back to the Chinese string and rendered "页" in every UI
  // language.
  let str;
  if (dict && Object.prototype.hasOwnProperty.call(dict, key)) str = dict[key];
  else if (Object.prototype.hasOwnProperty.call(I18N.zh, key)) str = I18N.zh[key];
  else str = key;
  if (vars) {
    Object.keys(vars).forEach(k => { str = str.split('{' + k + '}').join(vars[k]); });
  }
  return str;
}

// UI language code -> BCP 47 tag for the lang attribute. Only zh needs a
// script subtag; the rest are already valid as-is.
const BCP47_FOR_UI_LANG = { zh: 'zh-Hans', 'zh-hant': 'zh-Hant' };

function applyI18n() {
  // Keep the document language in step with the UI. This was hardcoded to
  // "zh", so assistive tech applied Chinese pronunciation rules to every
  // interface string no matter which language was selected.
  const uiLang = resolveUiLang();
  document.documentElement.lang = BCP47_FOR_UI_LANG[uiLang] || uiLang;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.innerHTML = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.title = t(el.dataset.i18nTitle);
  });
  // aria-label rather than title: controls whose only visible content is an
  // icon (✕, →) have no accessible name otherwise, and title is not reliably
  // announced by screen readers.
  document.querySelectorAll('[data-i18n-label]').forEach(el => {
    el.setAttribute('aria-label', t(el.dataset.i18nLabel));
  });
}
