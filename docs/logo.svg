<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="title desc">
  <title id="title">Lingua Lector</title>
  <desc id="desc">A page of text with one sentence highlighted, wrapping from the end of one line onto the start of the next.</desc>
  <rect width="32" height="32" rx="7" fill="#8a5a3f"/>
  <g fill="#ffffff" fill-opacity="0.5">
    <rect x="6" y="6" width="20" height="3" rx="1.5"/>
    <rect x="6" y="11.7" width="7" height="3" rx="1.5"/>
    <rect x="20" y="17.4" width="6" height="3" rx="1.5"/>
    <rect x="6" y="23.1" width="14" height="3" rx="1.5"/>
  </g>
  <g fill="#f6e6c8">
    <rect x="14.5" y="11.4" width="11.5" height="3.6" rx="1.8"/>
    <rect x="6" y="17.1" width="12.5" height="3.6" rx="1.8"/>
  </g>
</svg>
